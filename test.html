<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Cinema</title>
    <style>
        body { font-family: monospace; background: #000; color: #0f0; padding: 20px; }
        .card { border: 1px solid #333; margin: 10px; padding: 10px; }
        img { width: 100px; }
    </style>
</head>
<body>
    <h1>🔧 TEST CINEMA STRANGER</h1>
    <div>
        <label>Servidor: </label>
        <input type="text" id="server" value="http://100.96.249.54:8080" style="width: 300px;">
        <button onclick="test()">Probar</button>
    </div>
    <pre id="log" style="background:#111; padding:10px; overflow:auto; max-height:200px;"></pre>
    <div id="results"></div>

    <script>
        function log(msg) {
            const logDiv = document.getElementById('log');
            logDiv.innerHTML += new Date().toLocaleTimeString() + ': ' + msg + '\n';
        }

        async function test() {
            const server = document.getElementById('server').value;
            const url = server + '/cinecalidad/peliculas?pagina=1&limite=5';
            log('📡 Fetching: ' + url);
            
            try {
                const response = await fetch(url);
                log('✅ Status: ' + response.status);
                const data = await response.json();
                log('✅ Data type: ' + typeof data);
                log('✅ Has items? ' + !!(data.items));
                log('✅ Items length: ' + (data.items ? data.items.length : 'N/A'));
                
                const resultsDiv = document.getElementById('results');
                resultsDiv.innerHTML = '';
                
                if (data.items && data.items.length > 0) {
                    data.items.forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'card';
                        div.innerHTML = '<img src="' + (item.portada || '') + '"><br><strong>' + (item.titulo || 'Sin titulo') + '</strong>';
                        resultsDiv.appendChild(div);
                    });
                    log('🎉 Mostradas ' + data.items.length + ' películas');
                } else {
                    log('⚠️ No hay items en la respuesta');
                    resultsDiv.innerHTML = '<div style="color:red">No se encontraron películas. Respuesta: ' + JSON.stringify(data) + '</div>';
                }
            } catch(error) {
                log('❌ Error: ' + error.message);
            }
        }
        
        test();
    </script>
</body>
</html>
