<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Cinema</title>
    <style>
        body { font-family: monospace; background: #0a0a0a; color: #0f0; padding: 20px; }
        .card { border: 1px solid #333; margin: 10px; padding: 10px; display: inline-block; width: 150px; text-align: center; }
        img { width: 100px; height: 150px; object-fit: cover; }
        .error { color: #f00; }
        .success { color: #0f0; }
        pre { background: #111; padding: 10px; overflow: auto; max-height: 200px; font-size: 11px; }
    </style>
</head>
<body>
    <h1>🔧 TEST CINEMA STRANGER</h1>
    <div>
        <label>Servidor: </label>
        <input type="text" id="server" value="http://100.96.249.54:8080" style="width: 300px; background: #333; color: #fff; border: none; padding: 5px;">
        <button onclick="test()">Probar</button>
    </div>
    <pre id="log">Iniciando prueba...</pre>
    <div id="results"></div>

    <script>
        function log(msg, isError = false) {
            const logDiv = document.getElementById('log');
            const color = isError ? '#f00' : '#0f0';
            logDiv.innerHTML += `<span style="color:${color}">${new Date().toLocaleTimeString()}: ${msg}</span>\n`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        async function test() {
            const server = document.getElementById('server').value;
            const url = server + '/cinecalidad/peliculas?pagina=1&limite=5';
            log('📡 Fetching: ' + url);
            
            try {
                const response = await fetch(url);
                log('✅ Status: ' + response.status);
                const data = await response.json();
                log('✅ Data type: ' + typeof data);
                log('✅ Data keys: ' + Object.keys(data).join(', '));
                log('✅ Has items? ' + !!(data.items));
                log('✅ Items length: ' + (data.items ? data.items.length : 'N/A'));
                
                const resultsDiv = document.getElementById('results');
                resultsDiv.innerHTML = '<h3>Resultados:</h3>';
                
                if (data.items && data.items.length > 0) {
                    data.items.forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'card';
                        const img = document.createElement('img');
                        img.src = item.portada || '';
                        img.onerror = () => img.src = 'https://via.placeholder.com/100x150?text=No+Image';
                        const title = document.createElement('div');
                        title.innerHTML = '<strong>' + (item.titulo || 'Sin titulo') + '</strong>';
                        div.appendChild(img);
                        div.appendChild(title);
                        resultsDiv.appendChild(div);
                    });
                    log('🎉 Mostradas ' + data.items.length + ' películas');
                } else {
                    log('⚠️ No hay items en la respuesta', true);
                    resultsDiv.innerHTML += '<div class="error">No se encontraron películas. Respuesta: ' + JSON.stringify(data).substring(0, 200) + '</div>';
                }
            } catch(error) {
                log('❌ Error: ' + error.message, true);
            }
        }
        
        // Ejecutar automáticamente
        setTimeout(test, 500);
    </script>
</body>
</html>
