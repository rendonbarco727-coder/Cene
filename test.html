<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { background:#111; color:#fff; font-family:sans-serif; padding:20px; }
    button { padding:16px 32px; font-size:18px; background:#e50914; color:#fff; border:none; border-radius:8px; margin-top:20px; }
    pre { background:#222; padding:12px; border-radius:6px; font-size:12px; overflow:auto; margin-top:16px; }
  </style>
</head>
<body>
  <h3>Test vimeos /d/</h3>
  <div id="estado">Consultando servidor...</div>
  <button id="btn" style="display:none">▶ Play</button>
  <pre id="log"></pre>

  <script>
    const URL_PELICULA = "https://www.cinecalidad.am/ver-pelicula/backrooms-sin-salida/#";
    const SERVIDOR = "https://ruben-inspiron-5558.tail5c4d3b.ts.net";
    let downloadUrl = null;

    fetch(`${SERVIDOR}/resolver?url=${encodeURIComponent(URL_PELICULA)}`)
      .then(r => r.json())
      .then(data => {
        document.getElementById('log').textContent = JSON.stringify(data, null, 2);
        if (data.download_url) {
          downloadUrl = data.download_url;
          document.getElementById('estado').textContent = '✅ download_url encontrada';
          document.getElementById('btn').style.display = 'block';
        } else {
          document.getElementById('estado').textContent = '❌ Sin download_url — solo HLS';
        }
      })
      .catch(e => {
        document.getElementById('estado').textContent = '❌ Error: ' + e;
      });

    document.getElementById('btn').onclick = () => {
      window.open(downloadUrl, '_blank');
    };
  </script>
</body>
</html>
