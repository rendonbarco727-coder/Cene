<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Cinema Stranger — Neumorphic App</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Syne:wght@700;800&display=swap');

  :root {
    --black: #0f1016;
    --dark: #1a1b26;
    --card: #1a1b26;
    --border: transparent;
    --text: #e2e4f0;
    --text-dim: #62657a;
    --accent: #2ac3de;
    --accent2: #7aa2f7;
    --accent3: #bb9af3;
    
    /* Neumorphic Double Shadow Presets */
    --flat-drop: 5px 5px 10px #0e0f15, -4px -4px 10px #262737;
    --flat-drop-small: 3px 3px 6px #0e0f15, -2px -2px 6px #262737;
    --inner-shadow: inset 4px 4px 8px #0e0f15, inset -4px -4px 8px #262737;
    --inner-shadow-small: inset 2px 2px 5px #0e0f15, inset -2px -2px 5px #262737;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--black);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px 0;
  }

  /* CONTENEDOR DISPOSITIVO CENTRAL */
  .phone {
    background: var(--dark);
    border-radius: 40px;
    overflow: hidden;
    position: relative;
    width: 340px;
    height: 680px;
    box-shadow: 15px 15px 30px #0a0a0f, -10px -10px 30px #2a2c3d;
    display: flex;
    flex-direction: column;
  }

  /* VISTAS DE CONTENIDO MULTIPLE */
  .app-screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 32px 16px 85px; 
    overflow-y: auto;
    scrollbar-width: none;
  }
  .app-screen::-webkit-scrollbar { display: none; }

  /* HEADER GENERAL */
  .cinema-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    padding-top: 12px;
  }
  .cinema-logo { font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 800; color: #ffffff; letter-spacing: -0.5px; }

  .icon-btn {
    width: 36px; height: 36px; border-radius: 50%; background: var(--dark); border: none;
    display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text);
    box-shadow: var(--flat-drop-small); transition: 0.2s; outline: none;
  }
  .icon-btn:active { box-shadow: var(--inner-shadow-small); }

  /* COMPONENTES DE NAVEGACIÓN */
  .tabs { display: flex; gap: 12px; margin-bottom: 18px; }
  .tab { flex: 1; text-align: center; padding: 10px 0; border-radius: 20px; font-size: 12px; color: var(--text-dim); background: var(--dark); border: none; font-weight: 500; cursor: pointer; box-shadow: var(--flat-drop-small); transition: all 0.2s; }
  .tab.active { box-shadow: var(--inner-shadow-small); color: var(--accent3); font-weight: 700; }

  /* BÚSQUEDA NEUMÓRFICA */
  .search-bar-wrap { position: relative; margin-bottom: 20px; }
  .search-bar { width: 100%; background: var(--dark); border: none; border-radius: 18px; padding: 12px 16px 12px 42px; color: var(--text); box-shadow: var(--inner-shadow); outline: none; font-size: 12px; font-family: inherit; }
  .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-dim); }

  .section-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
  .section-title { font-family: 'Syne', sans-serif; font-size: 12px; color: #ffffff; font-weight: 700; }
  .section-count { font-size: 10px; color: var(--text-dim); }

  /* REJILLA DE TARJETAS (MOVIES & SERIES) */
  .movie-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding-bottom: 16px; }
  .movie-card { border-radius: 16px; background: var(--dark); box-shadow: var(--flat-drop-small); position: relative; aspect-ratio: 2/3; overflow: hidden; padding: 5px; cursor: pointer; transition: transform 0.2s; }
  .movie-card:active { transform: scale(0.97); }
  .movie-poster { width: 100%; height: 78%; border-radius: 12px; object-fit: cover; background: #151620; box-shadow: var(--inner-shadow-small); display: block; }
  .movie-title { font-size: 9px; text-align: center; color: var(--text); margin-top: 5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 2px; }
  .movie-badge { position: absolute; top: 10px; right: 10px; background: var(--dark); box-shadow: var(--flat-drop-small); border-radius: 6px; padding: 2px 5px; font-size: 7px; color: var(--accent2); font-weight: bold; text-transform: uppercase; }

  /* BOTÓN CARGAR MÁS */
  .load-more-wrap { text-align: center; margin: 12px 0; }
  .btn-load { background: var(--dark); border: none; color: var(--text); font-size: 11px; padding: 10px 24px; border-radius: 16px; box-shadow: var(--flat-drop-small); cursor: pointer; font-weight: 500; }
  .btn-load:active { box-shadow: var(--inner-shadow-small); }

  /* ESTADOS DEL CONTENIDO */
  .state-msg { text-align: center; padding: 40px 10px; color: var(--text-dim); font-size: 12px; }
  .spinner { display: inline-block; width: 24px; height: 24px; border: 3px solid #151620; border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; margin-bottom: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* DETALLES DESPLEGABLES (SLIDE PANEL NEUMÓRFICO) */
  .detail-overlay { display: none; position: absolute; inset: 0; background: rgba(15,16,22,0.7); backdrop-filter: blur(8px); z-index: 50; flex-direction: column; justify-content: flex-end; }
  .detail-panel { background: var(--dark); border-radius: 32px 32px 0 0; box-shadow: 0 -10px 30px rgba(0,0,0,0.5); width: 100%; max-height: 85%; overflow-y: auto; padding: 24px 18px; position: relative; scrollbar-width: none; }
  .detail-panel::-webkit-scrollbar { display: none; }
  .detail-close { position: absolute; top: 16px; right: 16px; z-index: 55; }
  .detail-header { display: flex; gap: 16px; margin-bottom: 20px; align-items: center; }
  .detail-poster { width: 85px; aspect-ratio: 2/3; object-fit: cover; border-radius: 14px; box-shadow: var(--flat-drop-small); background: #151620; }
  .detail-meta { flex: 1; min-width: 0; }
  .detail-title { font-family: 'Syne', sans-serif; font-size: 16px; color: #fff; margin-bottom: 6px; font-weight: 700; line-height: 1.2; }
  
  .btn-play { display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--dark); color: var(--accent3); border: none; border-radius: 16px; padding: 10px 18px; font-size: 12px; font-weight: 700; cursor: pointer; box-shadow: var(--flat-drop-small); width: fit-content; }
  .btn-play:active { box-shadow: var(--inner-shadow-small); }

  /* TEMPORADAS Y EPISODIOS */
  .temp-tabs { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px; margin-bottom: 12px; scrollbar-width: none; }
  .temp-tabs::-webkit-scrollbar { display: none; }
  .temp-tab { flex-shrink: 0; background: var(--dark); border: none; color: var(--text-dim); border-radius: 12px; padding: 6px 14px; font-size: 11px; box-shadow: var(--flat-drop-small); cursor: pointer; }
  .temp-tab.active { box-shadow: var(--inner-shadow-small); color: var(--accent); font-weight: bold; }

  .ep-list { display: flex; flex-direction: column; gap: 10px; }
  .ep-card { display: flex; align-items: center; gap: 12px; padding: 8px; background: var(--dark); box-shadow: var(--flat-drop-small); border-radius: 16px; cursor: pointer; }
  .ep-thumb { width: 55px; aspect-ratio: 16/9; object-fit: cover; border-radius: 10px; background: #151620; box-shadow: var(--inner-shadow-small); }
  .ep-info { flex: 1; min-width: 0; }
  .ep-title { font-size: 11px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* CONFIGURACIÓN MODAL INTERNO */
  .modal-overlay { display: none; position: absolute; inset: 0; background: rgba(15,16,22,0.8); backdrop-filter: blur(6px); z-index: 100; align-items: center; justify-content: center; padding: 16px; }
  .modal { background: var(--dark); border-radius: 28px; box-shadow: var(--flat-drop); padding: 24px; width: 100%; }
  .modal h2 { font-family: 'Syne', sans-serif; font-size: 16px; color: var(--accent3); margin-bottom: 16px; }
  .modal label { display: block; font-size: 10px; color: var(--text-dim); text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.5px; }
  .modal-actions { display: flex; gap: 12px; margin-top: 18px; justify-content: flex-end; }
  .btn { padding: 10px 16px; border-radius: 14px; font-size: 11px; font-weight: 700; cursor: pointer; border: none; }
  .btn-ghost { background: var(--dark); color: var(--text-dim); box-shadow: var(--flat-drop-small); }
  .btn-ghost:active { box-shadow: var(--inner-shadow-small); }
  .btn-primary { background: var(--dark); color: var(--accent); box-shadow: var(--flat-drop-small); }
  .btn-primary:active { box-shadow: var(--inner-shadow-small); }

  /* REPRODUCITOR COMPLETO PANTALLA COMPLETA */
  .player-overlay { display: none; position: absolute; inset: 0; background: #000; z-index: 200; flex-direction: column; justify-content: space-between; padding: 32px 16px 24px; }
  .player-bar { display: flex; align-items: center; gap: 12px; }
  .player-bar-title { font-size: 12px; color: var(--text); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; text-align: center; margin-right: 36px; }
  video { width: 100%; flex: 1; object-fit: contain; margin: 16px 0; }
  .player-loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.8); color: var(--text-dim); font-size: 12px; z-index: 210; text-align: center; padding: 20px; }

  /* NAVEGACIÓN INFERIOR DE LA APP */
  .bottom-nav { position: absolute; bottom: 0; left: 0; right: 0; background: var(--dark); box-shadow: -4px -10px 20px #0b0c11; display: flex; padding: 12px 0 16px; z-index: 40; }
  .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; color: var(--text-dim); font-size: 9px; font-weight: 500; cursor: pointer; background: none; border: none; }
  .nav-icon { font-size: 16px; margin-bottom: 3px; filter: saturate(0.2) opacity(0.6); transition: 0.2s; }
  .nav-item.active { color: var(--accent2); }
  .nav-item.active .nav-icon { filter: saturate(1) opacity(1); }
</style>
</head>
<body>

<div class="phone">

  <!-- VISTA CENTRAL: EXPLORADOR / CATÁLOGO -->
  <div class="app-screen" id="view-catalog">
    <div class="cinema-header">
      <div class="cinema-logo">CINEMA STRANGER</div>
      <button class="icon-btn" onclick="openSettings()" title="Configuración">⚙</button>
    </div>

    <div class="search-bar-wrap">
      <div class="search-icon">🔍</div>
      <input type="text" id="search-input" class="search-bar" placeholder="Buscar películas y series...">
    </div>

    <div class="tabs">
      <button class="tab active" id="tab-peliculas" onclick="switchTab('peliculas')">Películas</button>
      <button class="tab" id="tab-series" onclick="switchTab('series')">Series</button>
    </div>

    <!-- Resultados Búsqueda -->
    <section id="search-section" style="display:none">
      <div class="section-header">
        <div class="section-title">Resultados</div>
        <div class="section-count" id="search-count"></div>
      </div>
      <div class="movie-grid" id="search-grid"></div>
      <div id="search-state"></div>
    </section>

    <!-- Sección Películas -->
    <section id="peliculas-section">
      <div class="section-header">
        <div class="section-title">Películas Disponibles</div>
        <div class="section-count" id="peliculas-count"></div>
      </div>
      <div class="movie-grid" id="peliculas-grid"></div>
      <div id="peliculas-state"></div>
      <div class="load-more-wrap" id="peliculas-loadmore" style="display:none">
        <button class="btn-load" onclick="loadMore('peliculas')">Cargar más</button>
      </div>
    </section>

    <!-- Sección Series -->
    <section id="series-section" style="display:none">
      <div class="section-header">
        <div class="section-title">Series de TV</div>
        <div class="section-count" id="series-count"></div>
      </div>
      <div class="movie-grid" id="series-grid"></div>
      <div id="series-state"></div>
      <div class="load-more-wrap" id="series-loadmore" style="display:none">
        <button class="btn-load" onclick="loadMore('series')">Cargar más</button>
      </div>
    </section>
  </div>

  <!-- VISTA AUXILIAR: EN CONSTRUCCIÓN / VACÍAS PARA ADAPTACIÓN FUTURA -->
  <div class="app-screen" id="view-mylist" style="display: none;">
    <div class="cinema-header"><div class="cinema-logo">MI LISTA</div></div>
    <div class="state-msg">Tu lista de seguimiento está vacía de momento.</div>
  </div>

  <div class="app-screen" id="view-downloads" style="display: none;">
    <div class="cinema-header"><div class="cinema-logo">DESCARGAS</div></div>
    <div class="state-msg">No hay contenido sin conexión guardado.</div>
  </div>


  <!-- DETALLES DESPLEGABLES -->
  <div class="detail-overlay" id="detail-overlay" onclick="if(event.target===this)closeDetail()">
    <div class="detail-panel">
      <button class="icon-btn detail-close" onclick="closeDetail()">✕</button>
      <div class="detail-header">
        <img class="detail-poster" id="detail-poster" src="" alt="">
        <div class="detail-meta">
          <div class="detail-title" id="detail-title"></div>
          <button class="btn-play" id="btn-play-main" onclick="playMain()">▶ Reproducir</button>
        </div>
      </div>
      
      <!-- Listado exclusivo de Series -->
      <div id="detail-episodes" style="display:none">
        <div style="font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;font-weight:700">Temporadas</div>
        <div class="temp-tabs" id="temp-tabs"></div>
        <div class="ep-list" id="ep-list"></div>
        <div id="ep-state"></div>
      </div>
    </div>
  </div>

  <!-- CONFIGURACIÓN SERVIDOR -->
  <div class="modal-overlay" id="settings-modal" onclick="if(event.target===this)closeSettings()">
    <div class="modal">
      <h2>⚙ Servidor Stream</h2>
      <label>URL del Endpoint</label>
      <input type="text" id="server-url-input" class="search-bar" style="padding-left:14px" placeholder="https://tu-servidor.com">
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeSettings()">Cancelar</button>
        <button class="btn btn-primary" onclick="saveSettings()">Guardar</button>
      </div>
    </div>
  </div>

  <!-- REPRODUCTOR COMPLETO NEUMÓRFICO -->
  <div class="player-overlay" id="player-overlay">
    <div class="player-bar">
      <button class="icon-btn" onclick="closePlayer()">⏮</button>
      <div class="player-bar-title" id="player-title"></div>
    </div>
    <div class="player-loading" id="player-loading">
      <div class="spinner"></div><br>Resolviendo enlace de reproducción...
    </div>
    <video id="video-player" controls autoplay playsinline></video>
  </div>

  <!-- BARRA DE NAVEGACIÓN FIJA INFERIOR -->
  <div class="bottom-nav">
    <button class="nav-item active" onclick="switchMainView('catalog', this)">
      <div class="nav-icon">🎬</div><span>Cinema</span>
    </button>
    <button class="nav-item" onclick="switchMainView('mylist', this)">
      <div class="nav-icon">➕</div><span>Mi Lista</span>
    </button>
    <button class="nav-item" onclick="switchMainView('downloads', this)">
      <div class="nav-icon">⬇</div><span>Descargas</span>
    </button>
  </div>

</div>

<!-- CONTROLADORES REPRODUCTOR & LÓGICA -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.7/hls.min.js"></script>
<script>
const DEFAULT_SERVER = 'https://ruben-inspiron-5558.tail5c4d3b.ts.net';

function getServer() {
  return (localStorage.getItem('cs_server') || DEFAULT_SERVER).replace(/\/$/, '');
}

const state = {
  activeSection: 'peliculas',
  peliculas: { page: 1, total: 0, loading: false, done: false },
  series:    { page: 1, total: 0, loading: false, done: false },
  currentItem: null,
  currentTemporadas: null,
  currentTab: 'T1',
  hls: null,
};

// CONFIGURACIÓN DE CONEXIÓN
function openSettings() {
  document.getElementById('server-url-input').value = getServer();
  document.getElementById('settings-modal').style.display = 'flex';
}
function closeSettings() {
  document.getElementById('settings-modal').style.display = 'none';
}
function saveSettings() {
  const v = document.getElementById('server-url-input').value.trim();
  if (v) localStorage.setItem('cs_server', v);
  closeSettings();
  resetCatalog('peliculas');
  resetCatalog('series');
  loadCatalog('peliculas');
}

// NAVEGACIÓN ENTRE SECCIONES DEL MENÚ INFERIOR
function switchMainView(target, btn) {
  document.querySelectorAll('.bottom-nav .nav-item').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  document.getElementById('view-catalog').style.display = target === 'catalog' ? 'flex' : 'none';
  document.getElementById('view-mylist').style.display = target === 'mylist' ? 'flex' : 'none';
  document.getElementById('view-downloads').style.display = target === 'downloads' ? 'flex' : 'none';
}

// CAMBIO DE TABS INTERNAS (PELÍCULAS / SERIES)
function switchTab(tab) {
  state.activeSection = tab;
  document.querySelectorAll('.tabs .tab').forEach(b => b.classList.remove('active'));
  document.getElementById(`tab-${tab}`).classList.add('active');

  document.getElementById('peliculas-section').style.display = tab === 'peliculas' ? '' : 'none';
  document.getElementById('series-section').style.display    = tab === 'series'    ? '' : 'none';
  document.getElementById('search-section').style.display    = 'none';

  if (tab === 'series' && state.series.page === 1 && !state.series.loading) {
    loadCatalog('series');
  }
}

function resetCatalog(tipo) {
  state[tipo] = { page: 1, total: 0, loading: false, done: false };
  document.getElementById(`${tipo}-grid`).innerHTML = '';
  document.getElementById(`${tipo}-loadmore`).style.display = 'none';
}

// CONSULTA DE CONTENIDOS EN BACKEND
async function loadCatalog(tipo) {
  const s = state[tipo];
  if (s.loading || s.done) return;
  s.loading = true;

  const stateEl = document.getElementById(`${tipo}-state`);
  const loadMoreBtn = document.getElementById(`${tipo}-loadmore`);

  if (s.page === 1) {
    stateEl.innerHTML = `<div class="state-msg"><div class="spinner"></div><br>Conectando...</div>`;
  }

  try {
    const endpoint = tipo === 'peliculas' ? 'peliculas' : 'series';
    const url = `${getServer()}/cinecalidad/${endpoint}?pagina=${s.page}&limite=50`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    stateEl.innerHTML = '';
    const items = data.items || data || [];
    s.total = data.total || items.length;

    if (s.page === 1) {
      document.getElementById(`${tipo}-count`).textContent = s.total ? `${s.total.toLocaleString()} ítems` : '';
    }

    if (!items.length) {
      if (s.page === 1) stateEl.innerHTML = `<div class="state-msg">Sin entradas registradas</div>`;
      s.done = true;
      loadMoreBtn.style.display = 'none';
    } else {
      renderCards(items, `${tipo}-grid`);
      if (items.length < 50) {
        s.done = true;
        loadMoreBtn.style.display = 'none';
      } else {
        s.page++;
        loadMoreBtn.style.display = '';
      }
    }
  } catch (e) {
    stateEl.innerHTML = `<div class="state-msg">⚠️ Error en la red.<br><small style="font-size:10px; color:var(--text-dim)">Verifica la URL del servidor.</small></div>`;
  } finally {
    s.loading = false;
  }
}

function loadMore(tipo) { loadCatalog(tipo); }

// RENDERIZADO DE TARJETA CON IDENTIFICADOR NEUMÓRFICO
function renderCards(items, gridId) {
  const grid = document.getElementById(gridId);
  items.forEach((item) => {
    const card = document.createElement('div');
    card.className = 'movie-card';
    card.innerHTML = `
      <div class="movie-badge">${item.tipo === 'serie' ? 'Serie' : '4K'}</div>
      <img class="movie-poster" src="${item.portada || ''}" alt="" loading="lazy" onerror="this.style.opacity='.2'">
      <div class="movie-title">${esc(item.titulo)}</div>`;
    card.onclick = () => openDetail(item);
    grid.appendChild(card);
  });
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// BÚSQUEDA FLUIDA INTEGRADA (DEBOUNCE AUTOMÁTICO)
let searchTimer = null;
let _searchAbort = null;

document.getElementById('search-input').addEventListener('input', () => {
  clearTimeout(searchTimer);
  const q = document.getElementById('search-input').value.trim();
  if (!q) {
    document.getElementById('search-section').style.display = 'none';
    switchTab(state.activeSection);
    return;
  }
  
  document.getElementById('peliculas-section').style.display = 'none';
  document.getElementById('series-section').style.display = 'none';
  document.getElementById('search-section').style.display = 'block';
  document.getElementById('search-grid').innerHTML = '';
  document.getElementById('search-count').textContent = '';
  document.getElementById('search-state').innerHTML = `<div class="state-msg"><div class="spinner"></div><br>Buscando...</div>`;
  
  searchTimer = setTimeout(doSearch, 500);
});

async function doSearch() {
  const q = document.getElementById('search-input').value.trim();
  if (!q) return;

  if (_searchAbort) _searchAbort.abort();
  _searchAbort = new AbortController();

  const grid = document.getElementById('search-grid');
  const stateEl = document.getElementById('search-state');

  try {
    const res = await fetch(`${getServer()}/buscar?q=${encodeURIComponent(q)}`, { signal: _searchAbort.signal });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const items = await res.json();

    if (q !== document.getElementById('search-input').value.trim()) return;

    stateEl.innerHTML = '';
    document.getElementById('search-count').textContent = `${items.length} hallados`;
    if (!items.length) {
      stateEl.innerHTML = `<div class="state-msg">No se encontraron resultados</div>`;
    } else {
      renderCards(items, 'search-grid');
    }
  } catch (e) {
    if (e.name === 'AbortError') return;
    stateEl.innerHTML = `<div class="state-msg">⚠️ Fallo de conexión externa</div>`;
  }
}

// INTERFAZ DE DETALLES (PANEL COMPACTO DESPLEGABLE)
function openDetail(item) {
  state.currentItem = item;
  state.currentTemporadas = null;

  document.getElementById('detail-poster').src = item.portada || '';
  document.getElementById('detail-title').textContent = item.titulo;

  const btnPlay = document.getElementById('btn-play-main');
  const epsSection = document.getElementById('detail-episodes');

  if (item.tipo === 'serie') {
    btnPlay.style.display = 'none';
    epsSection.style.display = '';
    document.getElementById('ep-list').innerHTML = '';
    document.getElementById('ep-state').innerHTML = `<div class="state-msg"><div class="spinner"></div></div>`;
    document.getElementById('temp-tabs').innerHTML = '';
    loadEpisodes(item.url);
  } else {
    btnPlay.style.display = 'block';
    epsSection.style.display = 'none';
  }

  document.getElementById('detail-overlay').style.display = 'flex';
}

function closeDetail() {
  document.getElementById('detail-overlay').style.display = 'none';
}

// ADAPTACIÓN DE EPISODIOS
async function loadEpisodes(url) {
  try {
    const res = await fetch(`${getServer()}/episodios?url=${encodeURIComponent(url)}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    document.getElementById('ep-state').innerHTML = '';
    state.currentTemporadas = data;

    const temps = Object.keys(data).sort((a,b) => parseInt(a.replace('T','')) - parseInt(b.replace('T','')));
    if (!temps.length) {
      document.getElementById('ep-state').innerHTML = `<div class="state-msg">Contenido sin episodios indexados</div>`;
      return;
    }

    const tabsEl = document.getElementById('temp-tabs');
    tabsEl.innerHTML = '';
    temps.forEach((t, i) => {
      const btn = document.createElement('button');
      btn.className = 'temp-tab' + (i === 0 ? ' active' : '');
      btn.textContent = t;
      btn.onclick = () => {
        document.querySelectorAll('.temp-tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state.currentTab = t;
        renderEpisodes(t);
      };
      tabsEl.appendChild(btn);
    });

    state.currentTab = temps[0];
    renderEpisodes(temps[0]);
  } catch (e) {
    document.getElementById('ep-state').innerHTML = `<div class="state-msg">Error al cargar listado</div>`;
  }
}

function renderEpisodes(t) {
  const eps = state.currentTemporadas[t] || [];
  const list = document.getElementById('ep-list');
  list.innerHTML = '';

  eps.forEach((ep, i) => {
    const card = document.createElement('div');
    card.className = 'ep-card';
    card.innerHTML = `
      <img class="ep-thumb" src="${ep.portada || ''}" onerror="this.style.opacity='.3'">
      <div class="ep-info">
        <div class="ep-title">${esc(ep.titulo || `Episodio ${i+1}`)}</div>
      </div>`;
    card.onclick = () => playEpisode(ep, i);
    list.appendChild(card);
  });
}

// TRANSPORTE Y RESOLUCIÓN DE STREAMING DE VIDEO
async function playMain() {
  if (state.currentItem) await resolveAndPlay(state.currentItem.url, state.currentItem.titulo);
}

async function playEpisode(ep, idx) {
  const title = `${state.currentItem?.titulo || ''} — ${state.currentTab}E${idx+1}`;
  await resolveAndPlay(ep.url, title);
}

async function resolveAndPlay(url, titulo) {
  document.getElementById('player-title').textContent = titulo || '';
  document.getElementById('player-loading').style.display = 'flex';
  document.getElementById('video-player').style.display = 'none';
  document.getElementById('player-overlay').style.display = 'flex';

  try {
    const res = await fetch(`${getServer()}/resolver?url=${encodeURIComponent(url)}`);
    const data = await res.json();
    if (!data.url) throw new Error(data.error || 'Sin flujo de red');

    const streamUrl = `${getServer()}/stream?url=${encodeURIComponent(data.original || data.url)}`;
    startVideo(streamUrl);
  } catch (e) {
    document.getElementById('player-loading').innerHTML = `
      <div style="color:var(--accent2); margin-bottom:12px">⚠️ Stream Incompatible / Caído</div>
      <button class="btn btn-ghost" onclick="closePlayer()">Volver Atrás</button>`;
  }
}

function startVideo(src) {
  const video = document.getElementById('video-player');
  document.getElementById('player-loading').style.display = 'none';
  video.style.display = 'block';

  if (state.hls) { state.hls.destroy(); state.hls = null; }

  if (Hls.isSupported()) {
    const hls = new Hls({ enableWorker: false });
    hls.loadSource(src);
    hls.attachMedia(video);
    state.hls = hls;
  } else {
    video.src = src;
  }
}

function closePlayer() {
  const video = document.getElementById('video-player');
  video.pause();
  video.src = '';
  if (state.hls) { state.hls.destroy(); state.hls = null; }
  document.getElementById('player-overlay').style.display = 'none';
}

// INICIALIZACIÓN
loadCatalog('peliculas');
</script>
