<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cara con Sensores (FIX)</title>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }

body {
    background: #66E0D4;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: background 0.2s;
}

.shaking {
    background: #ff4d4d;
}

.face {
    width: 300px;
    transition: transform 0.05s;
}

.line {
    fill: none;
    stroke: #111;
    stroke-width: 4;
    stroke-linecap: round;
}

.mouth-open {
    fill: #2d9188;
    stroke: #111;
    stroke-width: 3;
    opacity: 0;
}

.talking .mouth-open { opacity: 1; }
.talking .mouth-closed { opacity: 0; }
</style>
</head>

<body id="body">

<svg id="face" class="face" viewBox="0 0 200 150">
    <path class="line" d="M50 55 Q60 45 70 55"/>
    <path class="line" d="M130 55 Q140 45 150 55"/>
    <path class="line mouth-closed" d="M75 95 Q100 105 125 95"/>
    <ellipse class="mouth-open" cx="100" cy="100" rx="25" ry="20"/>
</svg>

<script>
const body = document.getElementById("body");
const face = document.getElementById("face");

let last = { x: 0, y: 0, z: 0 };
let power = 0;
let active = false;

const THRESHOLD = 12;
const DECAY = 0.9;

/* =====================
   ACTIVAR SENSORES
===================== */
async function enableMotion() {
    if (typeof DeviceMotionEvent === "undefined") {
        alert("Este dispositivo no soporta sensores");
        return;
    }

    if (typeof DeviceMotionEvent.requestPermission === "function") {
        const res = await DeviceMotionEvent.requestPermission();
        if (res !== "granted") return;
    }

    window.addEventListener("devicemotion", onMotion, true);
    alert("Sensores ACTIVADOS. Ahora agita el teléfono.");
}

body.addEventListener("click", enableMotion);

/* =====================
   SENSOR
===================== */
function onMotion(e) {
    const acc = e.acceleration || e.accelerationIncludingGravity;
    if (!acc) return;

    const dx = Math.abs(acc.x - last.x);
    const dy = Math.abs(acc.y - last.y);
    const dz = Math.abs(acc.z - last.z);

    const delta = dx + dy + dz;

    if (delta > THRESHOLD) {
        power += delta * 0.5;
        if (!active) distort();
        if (navigator.vibrate) navigator.vibrate(30);
    }

    last = { x: acc.x, y: acc.y, z: acc.z };
}

/* =====================
   DISTORSIÓN
===================== */
function distort() {
    active = true;
    body.classList.add("shaking");

    requestAnimationFrame(loop);
}

function loop() {
    power *= DECAY;

    const sX = 1 + power / 40;
    const sY = 1 - power / 60;
    const rot = (Math.random() - 0.5) * power;

    face.style.transform = `scale(${sX}, ${sY}) rotate(${rot}deg)`;

    if (power > 1) {
        requestAnimationFrame(loop);
    } else {
        face.style.transform = "scale(1) rotate(0)";
        body.classList.remove("shaking");
        active = false;
        power = 0;
    }
}

/* =====================
   BOCA
===================== */
body.addEventListener("touchstart", () => body.classList.add("talking"));
body.addEventListener("touchend", () => body.classList.remove("talking"));
body.addEventListener("mousedown", () => body.classList.add("talking"));
body.addEventListener("mouseup", () => body.classList.remove("talking"));
</script>

</body>
</html>
