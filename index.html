<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Cinema Stranger — Preview</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />

<style>
  :root {
    --bg-main: #060a0e;
    --bg-card: #0c1217;
    --accent: #2dd4bf;
    --accent-deep: #14b8a6;
    --accent-2: #0ea5e9;
    --text: #eef2f5;
    --text-muted: #8b9aa4;
    --text-dim: #4d5c66;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; overflow-x: hidden; }
  body {
    background:
      radial-gradient(ellipse 1200px 600px at 15% -5%, rgba(20,184,166,0.14), transparent 60%),
      radial-gradient(ellipse 900px 500px at 95% 10%, rgba(14,165,233,0.09), transparent 55%),
      radial-gradient(ellipse 1000px 400px at 50% 100%, rgba(20,184,166,0.05), transparent 60%),
      var(--bg-main);
    color: var(--text);
    font-family: 'Outfit', system-ui, sans-serif;
    min-height: 100vh;
  }
  .font-display { font-family: 'Sora', sans-serif; font-weight: 800; }
  .glass { background: rgba(15,25,30,0.55); backdrop-filter: blur(20px) saturate(140%); -webkit-backdrop-filter: blur(20px) saturate(140%); }
  .glass-strong { background: rgba(12,22,26,0.85); backdrop-filter: blur(28px) saturate(160%); -webkit-backdrop-filter: blur(28px) saturate(160%); }
  .text-glow { text-shadow: 0 4px 30px rgba(0,0,0,0.6); }
  svg { display: block; flex-shrink: 0; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  img { display: block; }

  @keyframes kenBurns { 0% { transform: scale(1) translate(0,0); } 100% { transform: scale(1.08) translate(-1%, -1%); } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
  .kenburns { animation: kenBurns 20s ease-in-out infinite alternate; }
  .slideup { animation: slideUp 0.5s cubic-bezier(0.2,0.65,0.3,1) both; }
  .delay-1 { animation-delay: .08s; }
  .delay-2 { animation-delay: .16s; }

  /* ===== Header ===== */
  .header { position: fixed; top: 0; left: 0; right: 0; z-index: 100; border-bottom: 1px solid rgba(255,255,255,0.04); }
  .header-inner { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 16px; max-width: 1600px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .logo-box { width: 36px; height: 36px; border-radius: 12px; background: linear-gradient(135deg, var(--accent), var(--accent-deep)); display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(45,212,191,0.2); flex-shrink: 0; }
  .brand-name { font-size: 18px; letter-spacing: -0.01em; }
  .brand-name .hl { color: var(--accent); }
  .icon-btn { width: 36px; height: 36px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: var(--text-muted); flex-shrink: 0; }
  .icon-row { display: flex; align-items: center; gap: 8px; }

  /* ===== Search + pills ===== */
  .content-wrap { padding-top: 64px; padding-left: 16px; padding-right: 16px; max-width: 1600px; margin: 0 auto; }
  .search-box { position: relative; margin-top: 12px; }
  .search-box svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--text-dim); }
  .search-box input { width: 100%; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); border-radius: 999px; padding: 10px 16px 10px 40px; font-size: 14px; color: var(--text); outline: none; }
  .search-box input::placeholder { color: var(--text-dim); }

  .pill-row { display: flex; gap: 8px; overflow-x: auto; padding: 16px 0; scrollbar-width: none; }
  .pill-row::-webkit-scrollbar { display: none; }
  .pill { flex-shrink: 0; padding: 6px 14px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; border: 1px solid rgba(255,255,255,0.05); color: var(--text-muted); }
  .pill.active { background: rgba(45,212,191,0.15); border-color: rgba(45,212,191,0.4); color: var(--accent); }

  /* ===== Hero ===== */
  .hero { position: relative; width: 100%; height: 52vh; min-height: 320px; max-height: 560px; display: flex; flex-direction: column; justify-content: flex-end; padding: 20px; margin-bottom: 24px; overflow: hidden; }
  .hero-bg { position: absolute; inset: 0; background-size: cover; background-position: center top; }
  .hero-grad-1 { position: absolute; inset: 0; background: linear-gradient(to top, var(--bg-main) 0%, rgba(6,10,14,0.45) 55%, rgba(6,10,14,0.05) 100%); }
  .hero-grad-2 { position: absolute; inset: 0; background: linear-gradient(to right, rgba(6,10,14,0.8) 0%, transparent 60%); }
  .hero-content { position: relative; z-index: 10; max-width: 680px; }
  .badge-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .badge-featured { display: flex; align-items: center; gap: 6px; background: var(--accent); color: #060a0e; font-size: 10px; font-weight: 800; padding: 4px 10px; border-radius: 999px; letter-spacing: 0.03em; box-shadow: 0 8px 16px rgba(45,212,191,0.3); }
  .badge-featured svg { width: 12px; height: 12px; }
  .badge-meta { color: var(--text-muted); font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 999px; }
  .hero-title { font-size: 32px; font-weight: 800; color: #fff; margin-bottom: 16px; line-height: 1.05; }
  .hero-actions { display: flex; align-items: center; gap: 12px; }
  .btn-primary { display: inline-flex; align-items: center; gap: 8px; background: linear-gradient(to right, var(--accent), var(--accent-deep)); color: #060a0e; font-weight: 700; padding: 12px 28px; border-radius: 999px; font-size: 14px; }
  .btn-primary svg { width: 16px; height: 16px; fill: currentColor; }
  .btn-secondary { display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25); color: #fff; font-weight: 600; padding: 12px 20px; border-radius: 999px; font-size: 14px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  .btn-secondary svg { width: 16px; height: 16px; }

  /* ===== Tabs ===== */
  .tabs { display: flex; gap: 10px; padding: 0 16px; margin-bottom: 20px; max-width: 1600px; margin-left: auto; margin-right: auto; }
  .tab { padding: 8px 16px; border-radius: 999px; font-size: 14px; font-weight: 600; border: 1px solid rgba(255,255,255,0.05); color: var(--text-muted); }
  .tab.active { background: rgba(45,212,191,0.15); border-color: rgba(45,212,191,0.4); color: var(--accent); }

  /* ===== Cards ===== */
  .section { padding: 0 16px; max-width: 1600px; margin: 0 auto 96px; }
  .section-title { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .section-bar { width: 4px; height: 16px; border-radius: 999px; background: linear-gradient(to bottom, var(--accent), var(--accent-deep)); }
  .section-title h2 { font-size: 17px; font-weight: 700; }
  .card-row { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
  .card-row::-webkit-scrollbar { display: none; }
  .card { flex-shrink: 0; width: 130px; border-radius: 20px; overflow: hidden; position: relative; border: 1px solid rgba(255,255,255,0.05); background: var(--bg-card); box-shadow: 0 8px 24px rgba(0,0,0,0.35); }
  .card-img-wrap { position: relative; aspect-ratio: 2/3; overflow: hidden; }
  .card-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
  .card-grad { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.85), rgba(0,0,0,0.1) 60%, transparent); }
  .card-badge { position: absolute; top: 8px; left: 8px; font-size: 8.5px; font-weight: 700; letter-spacing: 0.03em; padding: 2px 6px; border-radius: 4px; }
  .card-badge.movie { background: rgba(45,212,191,0.2); color: var(--accent); border: 1px solid rgba(45,212,191,0.3); }
  .card-badge.serie { background: rgba(14,165,233,0.2); color: var(--accent-2); border: 1px solid rgba(14,165,233,0.3); }
  .card-title { position: absolute; bottom: 0; left: 0; right: 0; padding: 10px; font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 2px 8px rgba(0,0,0,0.6); }

  /* ===== Bottom nav ===== */
  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 190; border-top: 1px solid rgba(255,255,255,0.06); }
  .nav-inner { display: flex; max-width: 1600px; margin: 0 auto; padding: 0 8px; position: relative; }
  .nav-pill { position: absolute; top: 6px; bottom: 6px; width: calc(25% - 4px); left: 2px; border-radius: 12px; background: rgba(45,212,191,0.1); border: 1px solid rgba(45,212,191,0.15); }
  .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0; position: relative; z-index: 1; color: var(--text-dim); }
  .nav-item svg { width: 20px; height: 20px; }
  .nav-item span { font-size: 10.5px; font-weight: 600; }
  .nav-item.active { color: var(--accent); }
  .nav-item.active svg { transform: translateY(-2px); }
  .nav-item:not(.active) span { color: var(--text-dim); }
</style>
</head>
<body>

  <header class="header glass">
    <div class="header-inner">
      <div class="brand">
        <div class="logo-box">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#060a0e" stroke-width="2.5"><path d="M2 8l6 4-6 4V8z" fill="#060a0e"/><rect x="8" y="6" width="14" height="12" rx="2"/></svg>
        </div>
        <span class="font-display brand-name">Cinema<span class="hl">Stranger</span></span>
      </div>
      <div class="icon-row">
        <button class="icon-btn glass">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        </button>
        <button class="icon-btn glass">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div class="content-wrap">
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="text" placeholder="Buscar películas, series..." />
    </div>

    <div class="pill-row">
      <button class="pill active">Netflix</button>
      <button class="pill">Prime Video</button>
      <button class="pill">HBO Max</button>
      <button class="pill">Disney+</button>
    </div>
  </div>

  <div class="hero">
    <div class="hero-bg kenburns" style="background-image:url('https://images.unsplash.com/photo-1635805737707-575885ab0820?q=80&w=1600&auto=format&fit=crop');"></div>
    <div class="hero-grad-1"></div>
    <div class="hero-grad-2"></div>

    <div class="hero-content">
      <div class="badge-row slideup">
        <span class="badge-featured">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 7.4H22l-6 4.4 2.3 7.2L12 16.6 5.7 21l2.3-7.2-6-4.4h7.6z"/></svg>
          DESTACADO
        </span>
        <span class="badge-meta glass">Película · 4K Ultra HD</span>
      </div>

      <h1 class="font-display hero-title text-glow slideup delay-1">Avengers Infinity War</h1>

      <div class="hero-actions slideup delay-2">
        <button class="btn-primary">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          Ver ahora
        </button>
        <button class="btn-secondary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
          Más info
        </button>
      </div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active">Películas</button>
    <button class="tab">Series de TV</button>
  </div>

  <section class="section">
    <div class="section-title">
      <span class="section-bar"></span>
      <h2 class="font-display">Tendencias de Hoy</h2>
    </div>
    <div class="card-row">
      <div class="card">
        <div class="card-img-wrap">
          <img src="https://images.unsplash.com/photo-1635805737707-575885ab0820?q=80&w=400&auto=format&fit=crop" alt="" />
          <div class="card-grad"></div>
          <span class="card-badge movie">4K</span>
          <div class="card-title">Avengers Infinity War</div>
        </div>
      </div>
      <div class="card">
        <div class="card-img-wrap">
          <img src="https://images.unsplash.com/photo-1541562232579-512a21360020?q=80&w=400&auto=format&fit=crop" alt="" />
          <div class="card-grad"></div>
          <span class="card-badge serie">SERIE</span>
          <div class="card-title">Stranger Things</div>
        </div>
      </div>
      <div class="card">
        <div class="card-img-wrap">
          <img src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=400&auto=format&fit=crop" alt="" />
          <div class="card-grad"></div>
          <span class="card-badge movie">4K</span>
          <div class="card-title">Spider-Gwen</div>
        </div>
      </div>
    </div>
  </section>

  <nav class="bottom-nav glass-strong">
    <div class="nav-inner">
      <span class="nav-pill"></span>
      <button class="nav-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
        <span>Inicio</span>
      </button>
      <button class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg>
        <span>Mi Lista</span>
      </button>
      <button class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="15" rx="2"/><path d="M17 2l-5 5-5-5"/></svg>
        <span>TV en Vivo</span>
      </button>
      <button class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>Perfil</span>
      </button>
    </div>
  </nav>

</body>
</html>
