<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cinema Stranger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080a0f;
    --surface: #0e1118;
    --surface2: #161b26;
    --border: #1e2535;
    --accent: #e8b84b;
    --accent2: #c44b2b;
    --text: #e8e6e0;
    --muted: #6b7280;
    --card-w: 160px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── GRAIN OVERLAY ── */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 9999;
    opacity: 0.35;
  }

  /* ── HEADER ── */
  header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(8,10,15,0.92);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    display: flex; align-items: center; gap: 24px;
    height: 60px;
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px;
    letter-spacing: 3px;
    color: var(--accent);
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
  }
  .logo span { color: var(--accent2); }

  /* ── NAV TABS ── */
  nav { display: flex; gap: 4px; }
  nav button {
    background: none; border: none;
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px; font-weight: 500;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 6px 14px;
    border-radius: 4px;
    cursor: pointer;
    transition: color .2s, background .2s;
  }
  nav button:hover { color: var(--text); background: var(--surface2); }
  nav button.active { color: var(--accent); background: rgba(232,184,75,.08); }

  /* ── SEARCH ── */
  .search-wrap {
    margin-left: auto;
    display: flex; align-items: center;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    transition: border-color .2s;
    width: 220px;
  }
  .search-wrap:focus-within { border-color: var(--accent); }
  .search-wrap input {
    background: none; border: none; outline: none;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    padding: 8px 12px;
    width: 100%;
  }
  .search-wrap input::placeholder { color: var(--muted); }
  .search-wrap button {
    background: none; border: none; border-left: 1px solid var(--border);
    color: var(--muted); cursor: pointer;
    padding: 0 12px; height: 36px;
    display: flex; align-items: center;
    transition: color .2s;
  }
  .search-wrap button:hover { color: var(--accent); }

  /* ── SETTINGS ICON ── */
  .btn-settings {
    background: none; border: none; color: var(--muted);
    cursor: pointer; padding: 8px;
    border-radius: 6px;
    transition: color .2s, background .2s;
    display: flex; align-items: center;
  }
  .btn-settings:hover { color: var(--accent); background: var(--surface2); }

  /* ── SETTINGS MODAL ── */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.7);
    backdrop-filter: blur(6px);
    z-index: 500;
    align-items: center; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
    width: 440px; max-width: 92vw;
    animation: slideUp .25s ease;
  }
  @keyframes slideUp {
    from { opacity:0; transform: translateY(20px); }
    to   { opacity:1; transform: translateY(0); }
  }
  .modal h2 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px; letter-spacing: 2px;
    color: var(--accent); margin-bottom: 20px;
  }
  .modal label {
    display: block; font-size: 12px;
    text-transform: uppercase; letter-spacing: 1px;
    color: var(--muted); margin-bottom: 6px;
  }
  .modal input[type=text] {
    width: 100%; background: var(--surface2);
    border: 1px solid var(--border); border-radius: 6px;
    color: var(--text); font-family: 'DM Sans', sans-serif;
    font-size: 13px; padding: 10px 12px; outline: none;
    transition: border-color .2s;
  }
  .modal input[type=text]:focus { border-color: var(--accent); }
  .modal-actions {
    display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end;
  }
  .btn { 
    padding: 9px 20px; border-radius: 6px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px; font-weight: 500;
    cursor: pointer; border: none; transition: all .2s;
  }
  .btn-primary { background: var(--accent); color: #080a0f; }
  .btn-primary:hover { background: #f0c85a; }
  .btn-ghost { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-ghost:hover { background: var(--border); }

  /* ── MAIN ── */
  main { padding: 32px 24px; max-width: 1400px; margin: 0 auto; }

  /* ── SECTION HEADER ── */
  .section-header {
    display: flex; align-items: baseline; gap: 12px;
    margin-bottom: 20px;
  }
  .section-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px; letter-spacing: 2px; color: var(--text);
  }
  .section-count {
    font-size: 12px; color: var(--muted);
  }

  /* ── GRID ── */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(var(--card-w), 1fr));
    gap: 16px;
  }

  /* ── CARD ── */
  .card {
    cursor: pointer;
    border-radius: 8px;
    overflow: hidden;
    background: var(--surface);
    border: 1px solid var(--border);
    transition: transform .2s, border-color .2s, box-shadow .2s;
    animation: fadeIn .4s ease both;
  }
  .card:hover {
    transform: translateY(-4px);
    border-color: rgba(232,184,75,.4);
    box-shadow: 0 12px 32px rgba(0,0,0,.5);
  }
  @keyframes fadeIn {
    from { opacity:0; transform:translateY(12px); }
    to   { opacity:1; transform:translateY(0); }
  }
  .card-poster {
    width: 100%; aspect-ratio: 2/3;
    object-fit: cover; display: block;
    background: var(--surface2);
  }
  .card-info { padding: 10px; }
  .card-title {
    font-size: 12px; font-weight: 500;
    color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    margin-bottom: 4px;
  }
  .card-badge {
    display: inline-block;
    font-size: 9px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 1px;
    padding: 2px 6px; border-radius: 3px;
  }
  .badge-pelicula { background: rgba(196,75,43,.15); color: #e07a5f; }
  .badge-serie    { background: rgba(75,123,232,.15); color: #7ba4e0; }

  /* ── LOAD MORE ── */
  .load-more-wrap { text-align: center; margin-top: 36px; }
  .btn-load {
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); border-radius: 6px;
    padding: 12px 36px;
    font-family: 'DM Sans', sans-serif; font-size: 13px;
    cursor: pointer; transition: all .2s;
  }
  .btn-load:hover { border-color: var(--accent); color: var(--accent); }
  .btn-load:disabled { opacity: .4; cursor: not-allowed; }

  /* ── EMPTY / ERROR / LOADING ── */
  .state-msg {
    text-align: center; padding: 60px 20px;
    color: var(--muted); font-size: 14px;
  }
  .state-msg .icon { font-size: 42px; margin-bottom: 12px; }
  .spinner {
    display: inline-block;
    width: 32px; height: 32px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .7s linear infinite;
    margin-bottom: 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── DETAIL PANEL (slide-in) ── */
  .detail-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.75);
    backdrop-filter: blur(8px);
    z-index: 200;
    align-items: flex-end;
    justify-content: center;
  }
  .detail-overlay.open { display: flex; }

  .detail-panel {
    background: var(--surface);
    border-radius: 16px 16px 0 0;
    border: 1px solid var(--border);
    border-bottom: none;
    width: 100%; max-width: 860px;
    max-height: 90vh;
    overflow-y: auto;
    animation: panelUp .3s cubic-bezier(.16,1,.3,1);
    padding: 28px;
  }
  @keyframes panelUp {
    from { transform: translateY(100%); }
    to   { transform: translateY(0); }
  }
  .detail-header {
    display: flex; gap: 20px; margin-bottom: 24px;
  }
  .detail-poster {
    width: 120px; aspect-ratio: 2/3;
    object-fit: cover; border-radius: 8px;
    background: var(--surface2); flex-shrink: 0;
  }
  .detail-meta { flex: 1; min-width: 0; }
  .detail-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px; letter-spacing: 2px;
    margin-bottom: 8px; line-height: 1.1;
  }
  .detail-badge { margin-bottom: 16px; }
  .detail-close {
    position: absolute; top: 16px; right: 20px;
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); border-radius: 50%;
    width: 32px; height: 32px;
    font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all .2s;
  }
  .detail-close:hover { background: var(--border); }

  /* ── PLAY BTN ── */
  .btn-play {
    display: flex; align-items: center; gap: 8px;
    background: var(--accent); color: #080a0f;
    border: none; border-radius: 8px;
    padding: 12px 24px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px; font-weight: 600;
    cursor: pointer; transition: all .2s;
    width: fit-content;
  }
  .btn-play:hover { background: #f0c85a; transform: scale(1.02); }
  .btn-play:disabled { background: var(--muted); cursor: not-allowed; transform: none; }
  .btn-play svg { flex-shrink: 0; }

  /* ── TEMPORADAS ── */
  .temp-tabs {
    display: flex; gap: 6px; flex-wrap: wrap;
    margin: 20px 0 14px;
  }
  .temp-tab {
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--muted); border-radius: 4px;
    padding: 4px 12px; font-size: 12px; cursor: pointer;
    transition: all .2s;
  }
  .temp-tab.active { background: rgba(232,184,75,.1); border-color: var(--accent); color: var(--accent); }

  .ep-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 10px;
  }
  .ep-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px; overflow: hidden;
    cursor: pointer; transition: all .2s;
  }
  .ep-card:hover { border-color: rgba(232,184,75,.4); }
  .ep-thumb {
    width: 100%; aspect-ratio: 16/9;
    object-fit: cover; background: var(--border);
    display: block;
  }
  .ep-info { padding: 8px; }
  .ep-title { font-size: 11px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ── VIDEO PLAYER ── */
  .player-overlay {
    display: none; position: fixed; inset: 0;
    background: #000;
    z-index: 300;
    flex-direction: column;
    align-items: center; justify-content: center;
  }
  .player-overlay.open { display: flex; }
  .player-bar {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 12px 20px;
    display: flex; align-items: center; gap: 14px;
    background: linear-gradient(to bottom, rgba(0,0,0,.8), transparent);
  }
  .player-bar-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px; letter-spacing: 2px;
    color: var(--text);
  }
  .btn-back {
    background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
    color: var(--text); border-radius: 6px;
    padding: 6px 14px; font-size: 12px;
    cursor: pointer; transition: all .2s;
    display: flex; align-items: center; gap: 6px;
  }
  .btn-back:hover { background: rgba(255,255,255,.2); }
  video {
    width: 100%; max-height: 100vh;
    object-fit: contain;
  }
  .player-loading {
    position: absolute;
    color: var(--muted); font-size: 13px;
    text-align: center;
  }

  /* ── SEARCH RESULTS ── */
  #search-section { display: none; }

  /* ── RESPONSIVE ── */
  @media (max-width: 600px) {
    :root { --card-w: 130px; }
    header { padding: 0 14px; gap: 12px; }
    .logo { font-size: 20px; }
    nav button { padding: 5px 10px; font-size: 11px; }
    .search-wrap { width: 140px; }
    main { padding: 20px 14px; }
    .detail-panel { padding: 18px; }
    .detail-title { font-size: 22px; }
  }
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="logo" onclick="goHome()">CINEMA<span>·</span>STRANGER</div>
  <nav>
    <button class="active" data-tab="peliculas" onclick="switchTab('peliculas',this)">Películas</button>
    <button data-tab="series" onclick="switchTab('series',this)">Series</button>
  </nav>
  <div class="search-wrap">
    <input type="text" id="search-input" placeholder="Buscar..." onkeydown="if(event.key==='Enter')doSearch()">
    <button onclick="doSearch()" title="Buscar">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    </button>
  </div>
  <button class="btn-settings" onclick="openSettings()" title="Configuración">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
</header>

<!-- MAIN -->
<main>
  <!-- Search results -->
  <section id="search-section">
    <div class="section-header">
      <div class="section-title">Resultados</div>
      <div class="section-count" id="search-count"></div>
    </div>
    <div class="grid" id="search-grid"></div>
    <div id="search-state"></div>
  </section>

  <!-- Películas -->
  <section id="peliculas-section">
    <div class="section-header">
      <div class="section-title">Películas</div>
      <div class="section-count" id="peliculas-count"></div>
    </div>
    <div class="grid" id="peliculas-grid"></div>
    <div id="peliculas-state"></div>
    <div class="load-more-wrap" id="peliculas-loadmore" style="display:none">
      <button class="btn-load" onclick="loadMore('peliculas')">Cargar más</button>
    </div>
  </section>

  <!-- Series -->
  <section id="series-section" style="display:none">
    <div class="section-header">
      <div class="section-title">Series</div>
      <div class="section-count" id="series-count"></div>
    </div>
    <div class="grid" id="series-grid"></div>
    <div id="series-state"></div>
    <div class="load-more-wrap" id="series-loadmore" style="display:none">
      <button class="btn-load" onclick="loadMore('series')">Cargar más</button>
    </div>
  </section>
</main>

<!-- SETTINGS MODAL -->
<div class="modal-overlay" id="settings-modal" onclick="if(event.target===this)closeSettings()">
  <div class="modal">
    <h2>⚙ Configuración</h2>
    <label>URL del servidor</label>
    <input type="text" id="server-url-input" placeholder="https://tu-servidor.com">
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeSettings()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveSettings()">Guardar</button>
    </div>
  </div>
</div>

<!-- DETAIL PANEL -->
<div class="detail-overlay" id="detail-overlay" onclick="if(event.target===this)closeDetail()">
  <div class="detail-panel" style="position:relative">
    <button class="detail-close" onclick="closeDetail()">✕</button>
    <div class="detail-header">
      <img class="detail-poster" id="detail-poster" src="" alt="">
      <div class="detail-meta">
        <div class="detail-title" id="detail-title"></div>
        <div class="detail-badge" id="detail-badge"></div>
        <button class="btn-play" id="btn-play-main" onclick="playMain()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
          Reproducir
        </button>
      </div>
    </div>
    <!-- Series: temporadas y episodios -->
    <div id="detail-episodes" style="display:none">
      <div style="font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;">Temporadas</div>
      <div class="temp-tabs" id="temp-tabs"></div>
      <div class="ep-list" id="ep-list"></div>
      <div id="ep-state"></div>
    </div>
  </div>
</div>

<!-- PLAYER -->
<div class="player-overlay" id="player-overlay">
  <div class="player-bar">
    <button class="btn-back" onclick="closePlayer()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m15 18-6-6 6-6"/></svg>
      Volver
    </button>
    <div class="player-bar-title" id="player-title"></div>
  </div>
  <div class="player-loading" id="player-loading">
    <div class="spinner"></div><br>Resolviendo stream...
  </div>
  <video id="video-player" controls autoplay playsinline></video>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.7/hls.min.js"></script>
<script>
// ═══════════════════════════════════════
//  CONFIG
// ═══════════════════════════════════════
const DEFAULT_SERVER = 'https://ruben-inspiron-5558.tail5c4d3b.ts.net';

function getServer() {
  return (localStorage.getItem('cs_server') || DEFAULT_SERVER).replace(/\/$/, '');
}

// ═══════════════════════════════════════
//  STATE
// ═══════════════════════════════════════
const state = {
  peliculas: { page: 1, total: 0, loading: false, done: false },
  series:    { page: 1, total: 0, loading: false, done: false },
  currentItem: null,
  currentTemporadas: null,
  currentTab: 'T1',
  hls: null,
};

// ═══════════════════════════════════════
//  SETTINGS
// ═══════════════════════════════════════
function openSettings() {
  document.getElementById('server-url-input').value = getServer();
  document.getElementById('settings-modal').classList.add('open');
}
function closeSettings() {
  document.getElementById('settings-modal').classList.remove('open');
}
function saveSettings() {
  const v = document.getElementById('server-url-input').value.trim();
  if (v) localStorage.setItem('cs_server', v);
  closeSettings();
  // Reload catálogo
  resetCatalog('peliculas');
  resetCatalog('series');
  loadCatalog('peliculas');
}

// ═══════════════════════════════════════
//  NAV
// ═══════════════════════════════════════
function switchTab(tab, btn) {
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  document.getElementById('peliculas-section').style.display = tab === 'peliculas' ? '' : 'none';
  document.getElementById('series-section').style.display    = tab === 'series'    ? '' : 'none';
  document.getElementById('search-section').style.display    = 'none';

  if (tab === 'series' && state.series.page === 1 && !state.series.loading) {
    loadCatalog('series');
  }
}

function goHome() {
  document.getElementById('search-section').style.display = 'none';
  document.querySelector('[data-tab="peliculas"]').click();
}

// ═══════════════════════════════════════
//  CATALOG
// ═══════════════════════════════════════
function resetCatalog(tipo) {
  state[tipo] = { page: 1, total: 0, loading: false, done: false };
  document.getElementById(`${tipo}-grid`).innerHTML = '';
  document.getElementById(`${tipo}-loadmore`).style.display = 'none';
}

async function loadCatalog(tipo) {
  const s = state[tipo];
  if (s.loading || s.done) return;
  s.loading = true;

  const stateEl = document.getElementById(`${tipo}-state`);
  if (s.page === 1) {
    stateEl.innerHTML = `<div class="state-msg"><div class="spinner"></div><br>Cargando...</div>`;
  }

  try {
    const endpoint = tipo === 'peliculas' ? 'peliculas' : 'series';
    const url = `${getServer()}/cinecalidad/${endpoint}?pagina=${s.page}&limite=50`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    stateEl.innerHTML = '';
    const items = data.items || data || [];
    s.total = data.total || items.length;

    if (s.page === 1) {
      document.getElementById(`${tipo}-count`).textContent =
        s.total ? `${s.total.toLocaleString()} títulos` : '';
    }

    if (!items.length) {
      if (s.page === 1) stateEl.innerHTML = `<div class="state-msg"><div class="icon">🎬</div>Sin resultados</div>`;
      s.done = true;
    } else {
      renderCards(items, `${tipo}-grid`);
      s.page++;
      const loaded = (s.page - 1) * 50;
      if (loaded < s.total) {
        document.getElementById(`${tipo}-loadmore`).style.display = '';
      } else {
        s.done = true;
      }
    }
  } catch (e) {
    stateEl.innerHTML = `<div class="state-msg">
      <div class="icon">⚠️</div>
      Error: ${e.message}<br>
      <small style="color:var(--muted);margin-top:8px;display:block">
        Revisa la URL del servidor en ⚙ Configuración
      </small>
    </div>`;
  } finally {
    s.loading = false;
  }
}

function loadMore(tipo) {
  loadCatalog(tipo);
}

// ═══════════════════════════════════════
//  RENDER CARDS
// ═══════════════════════════════════════
function renderCards(items, gridId) {
  const grid = document.getElementById(gridId);
  items.forEach((item, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.style.animationDelay = `${(i % 30) * 25}ms`;
    card.innerHTML = `
      <img class="card-poster" src="${item.portada || ''}" alt="${esc(item.titulo)}"
           loading="lazy" onerror="this.style.opacity='.3'">
      <div class="card-info">
        <div class="card-title">${esc(item.titulo)}</div>
        <span class="card-badge badge-${item.tipo}">${item.tipo}</span>
      </div>`;
    card.onclick = () => openDetail(item);
    grid.appendChild(card);
  });
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ═══════════════════════════════════════
//  SEARCH
// ═══════════════════════════════════════
let searchTimer = null;
document.getElementById('search-input').addEventListener('input', () => {
  clearTimeout(searchTimer);
  const q = document.getElementById('search-input').value.trim();
  if (!q) { goHome(); return; }
  searchTimer = setTimeout(doSearch, 500);
});

async function doSearch() {
  const q = document.getElementById('search-input').value.trim();
  if (!q) return;

  document.getElementById('peliculas-section').style.display = 'none';
  document.getElementById('series-section').style.display = 'none';
  document.getElementById('search-section').style.display = '';

  const grid = document.getElementById('search-grid');
  const stateEl = document.getElementById('search-state');
  grid.innerHTML = '';
  stateEl.innerHTML = `<div class="state-msg"><div class="spinner"></div><br>Buscando "${q}"...</div>`;
  document.getElementById('search-count').textContent = '';

  try {
    const res = await fetch(`${getServer()}/buscar?q=${encodeURIComponent(q)}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const items = await res.json();
    stateEl.innerHTML = '';
    document.getElementById('search-count').textContent = `${items.length} resultados`;
    if (!items.length) {
      stateEl.innerHTML = `<div class="state-msg"><div class="icon">🔍</div>Sin resultados para "${q}"</div>`;
    } else {
      renderCards(items, 'search-grid');
    }
  } catch (e) {
    stateEl.innerHTML = `<div class="state-msg"><div class="icon">⚠️</div>Error: ${e.message}</div>`;
  }
}

// ═══════════════════════════════════════
//  DETAIL PANEL
// ═══════════════════════════════════════
function openDetail(item) {
  state.currentItem = item;
  state.currentTemporadas = null;

  document.getElementById('detail-poster').src = item.portada || '';
  document.getElementById('detail-title').textContent = item.titulo;
  document.getElementById('detail-badge').innerHTML =
    `<span class="card-badge badge-${item.tipo}">${item.tipo}</span>`;

  const btnPlay = document.getElementById('btn-play-main');
  const epsSection = document.getElementById('detail-episodes');

  if (item.tipo === 'serie') {
    btnPlay.style.display = 'none';
    epsSection.style.display = '';
    document.getElementById('ep-list').innerHTML = '';
    document.getElementById('ep-state').innerHTML =
      `<div class="state-msg"><div class="spinner"></div><br>Cargando episodios...</div>`;
    document.getElementById('temp-tabs').innerHTML = '';
    loadEpisodes(item.url);
  } else {
    btnPlay.style.display = 'flex';
    btnPlay.disabled = false;
    btnPlay.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg> Reproducir`;
    epsSection.style.display = 'none';
  }

  document.getElementById('detail-overlay').classList.add('open');
}

function closeDetail() {
  document.getElementById('detail-overlay').classList.remove('open');
}

// ═══════════════════════════════════════
//  EPISODES
// ═══════════════════════════════════════
async function loadEpisodes(url) {
  try {
    const res = await fetch(`${getServer()}/episodios?url=${encodeURIComponent(url)}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    document.getElementById('ep-state').innerHTML = '';
    state.currentTemporadas = data;

    const temps = Object.keys(data).sort((a,b) =>
      parseInt(a.replace('T','')) - parseInt(b.replace('T',''))
    );

    if (!temps.length) {
      document.getElementById('ep-state').innerHTML =
        `<div class="state-msg">Sin episodios disponibles</div>`;
      return;
    }

    // Render temporada tabs
    const tabsEl = document.getElementById('temp-tabs');
    tabsEl.innerHTML = '';
    temps.forEach((t, i) => {
      const btn = document.createElement('button');
      btn.className = 'temp-tab' + (i === 0 ? ' active' : '');
      btn.textContent = t;
      btn.onclick = () => selectTemp(t, btn);
      tabsEl.appendChild(btn);
    });

    state.currentTab = temps[0];
    renderEpisodes(temps[0]);
  } catch (e) {
    document.getElementById('ep-state').innerHTML =
      `<div class="state-msg">Error: ${e.message}</div>`;
  }
}

function selectTemp(t, btn) {
  document.querySelectorAll('.temp-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  state.currentTab = t;
  renderEpisodes(t);
}

function renderEpisodes(t) {
  const eps = state.currentTemporadas[t] || [];
  const list = document.getElementById('ep-list');
  list.innerHTML = '';

  eps.forEach((ep, i) => {
    const card = document.createElement('div');
    card.className = 'ep-card';
    card.innerHTML = `
      ${ep.portada
        ? `<img class="ep-thumb" src="${esc(ep.portada)}" alt="" loading="lazy" onerror="this.style.display='none'">`
        : `<div class="ep-thumb" style="background:var(--border);display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--muted)">▶</div>`
      }
      <div class="ep-info">
        <div class="ep-title">${esc(ep.titulo || `Ep. ${i+1}`)}</div>
      </div>`;
    card.onclick = () => playEpisode(ep, i);
    list.appendChild(card);
  });
}

// ═══════════════════════════════════════
//  PLAY
// ═══════════════════════════════════════
async function playMain() {
  if (!state.currentItem) return;
  await resolveAndPlay(state.currentItem.url, state.currentItem.titulo);
}

async function playEpisode(ep, idx) {
  const titulo = `${state.currentItem?.titulo || ''} · ${state.currentTab} E${idx+1}`;
  await resolveAndPlay(ep.url, titulo);
}

async function resolveAndPlay(url, titulo) {
  document.getElementById('player-title').textContent = titulo || '';
  document.getElementById('player-loading').style.display = '';
  document.getElementById('video-player').style.display = 'none';
  document.getElementById('player-overlay').classList.add('open');

  try {
    const res = await fetch(`${getServer()}/resolver?url=${encodeURIComponent(url)}`);
    const data = await res.json();

    if (!data.url) throw new Error(data.error || 'Sin stream');

    const streamUrl = `${getServer()}/stream?url=${encodeURIComponent(data.original || data.url)}`;
    startVideo(streamUrl);
  } catch (e) {
    document.getElementById('player-loading').innerHTML =
      `<div style="color:#e07a5f">⚠ ${e.message}</div>
       <button class="btn btn-ghost" style="margin-top:14px" onclick="closePlayer()">Cerrar</button>`;
  }
}

function startVideo(src) {
  const video = document.getElementById('video-player');
  document.getElementById('player-loading').style.display = 'none';
  video.style.display = '';

  if (state.hls) { state.hls.destroy(); state.hls = null; }

  if (Hls.isSupported() && (src.includes('.m3u8') || src.includes('stream'))) {
    const hls = new Hls({ enableWorker: false });
    hls.loadSource(src);
    hls.attachMedia(video);
    hls.on(Hls.Events.ERROR, (e, d) => {
      if (d.fatal) {
        document.getElementById('player-loading').style.display = '';
        document.getElementById('player-loading').innerHTML =
          `<div style="color:#e07a5f">⚠ Error de stream</div>
           <button class="btn btn-ghost" style="margin-top:14px" onclick="closePlayer()">Cerrar</button>`;
        video.style.display = 'none';
      }
    });
    state.hls = hls;
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = src;
    video.play();
  } else {
    video.src = src;
    video.play();
  }
}

function closePlayer() {
  const video = document.getElementById('video-player');
  video.pause();
  video.src = '';
  if (state.hls) { state.hls.destroy(); state.hls = null; }
  document.getElementById('player-overlay').classList.remove('open');
  document.getElementById('player-loading').style.display = '';
  video.style.display = 'none';
}

// ═══════════════════════════════════════
//  INIT
// ═══════════════════════════════════════
loadCatalog('peliculas');
</script>
