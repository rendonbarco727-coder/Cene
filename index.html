<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cinema Stranger — Premium Streaming Platform</title>
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Syne:wght@700;800&display=swap');

  :root {
    --bg-main: #141414;
    --bg-card: #181818;
    --bg-surface: #202020;
    --accent: #E50914;
    --accent-hover: #b80710;
    --text-color: #FFFFFF;
    --text-muted: #aaaaaa;
    --text-dim: #6c6c6c;
    --border-color: #282828;
    --shadow-premium: 0 8px 24px rgba(0,0,0,0.5);
    
    --plyr-color-main: #E50914;
    --plyr-video-background: #000000;
    --plyr-video-control-color: #FFFFFF;
  }

  * { 
    margin: 0; 
    padding: 0; 
    box-sizing: border-box; 
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background: var(--bg-main);
    color: var(--text-color);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .app-screen {
    width: 100%;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding-bottom: 85px;
    overflow-y: auto;
  }

  /* HEADER GENERAL */
  .cinema-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px;
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    background: linear-gradient(to bottom, rgba(20,20,20,0.8) 0%, rgba(20,20,20,0) 100%);
    backdrop-filter: blur(4px);
  }
  .cinema-logo { 
    font-family: 'Syne', sans-serif; 
    font-size: 22px; 
    font-weight: 800; 
    color: var(--accent); 
    letter-spacing: -0.5px; 
  }

  .icon-btn {
    width: 38px; height: 38px; border-radius: 50%; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1);
    display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-color);
  }

  /* HERO BANNER PRINCIPAL */
  .hero-banner {
    width: 100%;
    height: 55vh;
    min-height: 320px;
    max-height: 500px;
    position: relative;
    background-size: cover;
    background-position: center;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 20px;
    margin-bottom: 16px;
  }
  .hero-banner::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, var(--bg-main) 0%, rgba(20,20,20,0.2) 60%, rgba(20,20,20,0.7) 100%);
    z-index: 1;
  }
  .hero-content { position: relative; z-index: 2; text-align: center; max-width: 500px; margin: 0 auto; }
  .hero-title { font-family: 'Syne', sans-serif; font-size: 26px; font-weight: 800; margin-bottom: 8px; }
  .hero-meta { font-size: 12px; color: var(--text-muted); margin-bottom: 14px; display: flex; justify-content: center; gap: 8px; align-items: center; }
  .hero-badge { background: var(--accent); color: white; font-size: 9px; padding: 1px 5px; border-radius: 3px; font-weight: bold; }

  /* BOTONES */
  .btn-premium {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px 16px;
    border-radius: 4px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    border: none;
    transition: all 0.2s ease;
    width: 100%;
  }
  .btn-primary { background: var(--text-color); color: #000000; }
  .btn-secondary { background: #262626; color: var(--text-color); }
  .btn-rotate { background: #31a24c; color: white; display: none; }

  /* CAROUSELS Y GRIDS */
  .tabs { display: flex; gap: 12px; margin-bottom: 20px; padding: 0 16px; }
  .tab { flex: 1; text-align: center; padding: 10px 0; border-radius: 6px; font-size: 13px; color: var(--text-muted); background: var(--bg-surface); border: 1px solid transparent; cursor: pointer; }
  .tab.active { background: rgba(229, 9, 20, 0.1); border-color: var(--accent); color: var(--text-color); font-weight: 700; }

  .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding: 0 16px; }
  .section-title { font-family: 'Syne', sans-serif; font-size: 14px; color: #ffffff; font-weight: 700; text-transform: uppercase; border-left: 3px solid var(--accent); padding-left: 8px; }
  
  .carousel-container { position: relative; margin-bottom: 24px; width: 100%; }
  .movie-carousel { display: flex; gap: 12px; overflow-x: auto; padding: 4px 16px 12px; scrollbar-width: none; }
  .movie-carousel::-webkit-scrollbar { display: none; }
  .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; padding: 0 16px 16px; }

  .movie-card { flex: 0 0 115px; border-radius: 6px; background: var(--bg-card); position: relative; aspect-ratio: 2/3; overflow: hidden; cursor: pointer; box-shadow: var(--shadow-premium); }
  .movie-poster { width: 100%; height: 100%; object-fit: cover; }
  .card-meta { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%); display: flex; flex-direction: column; justify-content: flex-end; padding: 8px; }
  .movie-title { font-size: 11px; color: var(--text-color); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .movie-badge { position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,0.75); border-radius: 4px; padding: 2px 5px; font-size: 8px; font-weight: bold; }

  /* OVERLAY DETALLES ESTILO NETFLIX */
  .detail-overlay { 
    display: none; 
    position: fixed; 
    inset: 0; 
    background: var(--bg-main); 
    z-index: 200; 
    flex-direction: column;
    overflow-y: auto;
  }

  .detail-media-container {
    width: 100%;
    aspect-ratio: 16 / 9;
    position: relative;
    background-color: #000;
    z-index: 10;
    flex-shrink: 0;
  }

  .detail-backdrop-wrap, .embedded-player-wrap {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .detail-backdrop-wrap {
    background-size: cover;
    background-position: center;
  }
  .detail-backdrop-wrap::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(to top, var(--bg-main) 0%, rgba(20,20,20,0) 40%);
  }
  
  /* Plyr Layout Fix */
  .embedded-player-wrap {
    display: none;
    z-index: 5;
  }
  .embedded-player-wrap .plyr {
    height: 100% !important;
  }

  /* ====== OPTIMIZACIÓN DE CONTROLES PLYR EN MÓVIL (MÁS GRANDES Y VISIBLES) ====== */
  .plyr--video .plyr__controls {
    padding: 10px 14px !important;
    gap: 8px !important;
  }

  /* Forzar tamaño legible al contador de tiempo/duración */
  .plyr__time {
    font-size: 14px !important;
    font-weight: bold !important;
    color: #ffffff !important;
    padding: 0 4px !important;
    min-width: max-content;
  }

  /* Hacer los botones de control (Play, Rewind, Fast Forward) más grandes en móvil */
  .plyr__controls button {
    padding: 6px !important;
  }
  .plyr__controls button svg {
    width: 20px !important;
    height: 20px !important;
  }

  /* Ajuste de márgenes para que la barra de progreso respire y no aplaste los textos */
  .plyr__progress {
    margin-right: 4px !important;
  }
  /* ============================================================================== */

  .detail-back-btn {
    position: absolute; 
    top: 14px; 
    left: 14px; 
    z-index: 15;
    background: rgba(0,0,0,0.6); 
    border: none; 
    color: #fff;
    width: 36px; 
    height: 36px; 
    border-radius: 50%; 
    font-size: 18px;
    display: flex; 
    align-items: center; 
    justify-content: center;
    backdrop-filter: blur(4px);
  }

  .detail-body-content { padding: 20px 16px 10px; max-width: 800px; margin: 0 auto; width: 100%; }
  .detail-brand-tag { font-size: 10px; font-weight: 800; color: var(--accent); letter-spacing: 2.5px; margin-bottom: 6px; text-transform: uppercase; }
  .detail-title { font-size: 24px; color: #fff; margin-bottom: 12px; font-weight: 700; line-height: 1.2; font-family: 'Syne', sans-serif; }
  .detail-inline-meta { display: flex; align-items: center; gap: 14px; font-size: 13px; color: var(--text-muted); margin-bottom: 18px; }
  .meta-maturity { background: #333; color: #e2e2e2; padding: 1px 6px; border-radius: 3px; font-size: 11px; font-weight: 700; }
  
  .detail-action-buttons { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
  .detail-desc { font-size: 14px; color: #e6e6e6; line-height: 1.5; margin-bottom: 18px; text-align: justify; }
  .detail-credits { font-size: 12px; color: var(--text-dim); line-height: 1.6; margin-bottom: 26px; }
  .detail-credits span { color: var(--text-muted); }

  /* LISTADO DE EPISODIOS */
  .season-dropdown-wrapper { padding: 0 16px; margin-bottom: 18px; }
  .season-select-btn { background: #333; color: #fff; border: none; padding: 8px 14px; font-size: 13px; font-weight: 700; border-radius: 4px; display: inline-flex; align-items: center; gap: 8px; }
  .ep-list-netflix { display: flex; flex-direction: column; padding: 0 16px; gap: 24px; }
  .ep-node { display: flex; flex-direction: column; gap: 10px; }
  .ep-row-top { display: flex; align-items: center; gap: 14px; }
  .ep-media-box { width: 125px; aspect-ratio: 16/9; position: relative; border-radius: 4px; overflow: hidden; background: #000; flex-shrink: 0; }
  .ep-media-box img { width: 100%; height: 100%; object-fit: cover; }
  .ep-play-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; }
  .ep-play-ring { width: 30px; height: 30px; border-radius: 50%; background: rgba(20,20,20,0.8); border: 1px solid #fff; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 11px; }
  .ep-meta-info { flex: 1; min-width: 0; }
  .ep-headline { font-size: 14px; font-weight: 700; color: #fff; margin-bottom: 3px; }
  .ep-runtime { font-size: 12px; color: var(--text-muted); }

  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(18, 18, 18, 0.97); border-top: 1px solid var(--border-color); display: flex; padding: 10px 0 calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 190; backdrop-filter: blur(30px); }
  .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; color: var(--text-dim); font-size: 10px; font-weight: 700; background: none; border: none; }
  .nav-icon { font-size: 20px; margin-bottom: 3px; opacity: 0.5; }
  .nav-item.active { color: var(--text-color); }
  .nav-item.active .nav-icon { opacity: 1; color: var(--accent); }
</style>
</head>
<body>

  <div class="cinema-header" id="main-header">
    <div class="cinema-logo">STRANGER</div>
    <button class="icon-btn" onclick="openSettings()">⚙</button>
  </div>

  <div class="app-screen" id="view-catalog">
    <div class="hero-banner" id="hero-display" style="background-image: url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=500&q=80');">
      <div class="hero-content">
        <div class="hero-title" id="hero-title">Cargando Destacado...</div>
        <div class="hero-meta">
          <span class="hero-badge">TOP 10</span>
          <span id="hero-type">Película</span><span>•</span><span>4K Ultra HD</span>
        </div>
        <div class="hero-actions">
          <button class="btn-premium btn-primary" id="hero-play-btn" style="width:auto; padding:10px 28px;">▶ Ver Ahora</button>
        </div>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" id="tab-peliculas" onclick="switchTab('peliculas')">Películas</button>
      <button class="tab" id="tab-series" onclick="switchTab('series')">Series de TV</button>
    </div>

    <section id="peliculas-section">
      <div class="section-header"><div class="section-title">Tendencias de Hoy</div></div>
      <div class="carousel-container"><div class="movie-carousel" id="peliculas-grid"></div></div>
    </section>

    <section id="series-section" style="display:none">
      <div class="section-header"><div class="section-title">Series Recomendadas</div></div>
      <div class="carousel-container"><div class="movie-carousel" id="series-grid"></div></div>
    </section>
  </div>

  <div class="detail-overlay" id="detail-overlay">
    
    <div class="detail-media-container">
      <button class="detail-back-btn" onclick="closeDetail()">←</button>
      
      <div class="detail-backdrop-wrap" id="detail-backdrop"></div>
      
      <div class="embedded-player-wrap" id="embedded-player-container">
        <video id="video-player" playsinline crossorigin></video>
      </div>
    </div>
    
    <div class="detail-body-content">
      <div class="detail-brand-tag">N E T F L I X  Original</div>
      <div class="detail-title" id="detail-title">Cargando Título...</div>
      
      <div class="detail-inline-meta">
        <span class="meta-year" id="detail-year">2026</span>
        <span class="meta-maturity">TV-MA</span>
        <span id="detail-duration-lbl">1h 56m</span>
      </div>
      
      <div class="detail-action-buttons">
        <button class="btn-premium btn-primary" id="btn-play-main" onclick="playMain()">▶ Ver</button>
        <button class="btn-premium btn-rotate" id="btn-rotate-screen" onclick="toggleScreenRotation()">🔄 Girar Pantalla</button>
        <button class="btn-premium btn-secondary">↓ Descargar T1:E1</button>
      </div>
      
      <p class="detail-desc" id="detail-desc">Cargando sinopsis...</p>
      
      <div class="detail-credits">
        Protagonistas: <span>Stranger Cast, Ruben, AI Agent...</span><br>
        Creado por: <span>Cinema Stranger Inc.</span>
      </div>
    </div>
    
    <div id="detail-episodes-section" style="display:none">
      <div class="season-dropdown-wrapper">
        <button class="season-select-btn"><span>Temporada 1</span> ▼</button>
      </div>
      <div class="ep-list-netflix" id="ep-list"></div>
    </div>
  </div>

  <div class="bottom-nav">
    <button class="nav-item active" onclick="switchMainView('catalog', this)"><div class="nav-icon">🏠</div><span>Inicio</span></button>
    <button class="nav-item" onclick="switchMainView('search', this)"><div class="nav-icon">🔍</div><span>Buscar</span></button>
    <button class="nav-item" onclick="switchMainView('mylist', this)"><div class="nav-icon">＋</div><span>Mi Lista</span></button>
    <button class="nav-item" onclick="switchMainView('profile', this)"><div class="nav-icon">👤</div><span>Perfil</span></button>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.7/hls.min.js"></script>
<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
<script>
const DEFAULT_SERVER = 'https://ruben-inspiron-5558.tail5c4d3b.ts.net';
function getServer() { return localStorage.getItem('cs_server') || DEFAULT_SERVER; }

const state = {
  activeSection: 'peliculas',
  peliculas: { page: 1, loading: false },
  series:    { page: 1, loading: false },
  currentItem: null,
  hls: null,
  plyrInstance: null
};

function initPlyr() {
  if (!state.plyrInstance) {
    state.plyrInstance = new Plyr('#video-player', {
      // FIX DE JAVASCRIPT: Se redefine la matriz de controles agregando 'rewind' (atrás) junto a 'fast-forward' (adelante)
      // Y separamos 'current-time' y 'duration' en lugar de usar un label combinado compacto
      controls: [
        'play', 
        'rewind', 
        'fast-forward', 
        'progress', 
        'current-time', 
        'duration', 
        'mute', 
        'fullscreen'
      ],
      seekTime: 10, // Define saltos exactos de 10 segundos
      clickToPlay: true
    });
  }
}

function switchTab(tab) {
  state.activeSection = tab;
  document.querySelectorAll('.tabs .tab').forEach(b => b.classList.remove('active'));
  document.getElementById(`tab-${tab}`).classList.add('active');
  document.getElementById('peliculas-section').style.display = tab === 'peliculas' ? '' : 'none';
  document.getElementById('series-section').style.display    = tab === 'series'    ? '' : 'none';
  if (tab === 'series' && state.series.page === 1) loadCatalog('series');
}

async function loadCatalog(tipo) {
  if (state[tipo].loading) return;
  state[tipo].loading = true;
  try {
    const endpoint = tipo === 'peliculas' ? 'peliculas' : 'series';
    const res = await fetch(`${getServer()}/cinecalidad/${endpoint}?pagina=1&limite=30`);
    const items = await res.json();
    if (tipo === 'peliculas' && items.length > 0) setupHeroBanner(items[0]);
    renderCards(items, `${tipo}-grid`);
  } catch (e) { } finally { state[tipo].loading = false; }
}

function setupHeroBanner(item) {
  if(item.portada) document.getElementById('hero-display').style.backgroundImage = `url('${item.portada}')`;
  document.getElementById('hero-title').textContent = item.titulo;
  document.getElementById('hero-play-btn').onclick = () => openDetail(item);
}

function renderCards(items, gridId) {
  const grid = document.getElementById(gridId);
  grid.innerHTML = '';
  items.forEach((item) => {
    const card = document.createElement('div');
    card.className = 'movie-card';
    card.innerHTML = `<img class="movie-poster" src="${item.portada || ''}"><div class="card-meta"><div class="movie-title">${item.titulo}</div></div>`;
    card.onclick = () => openDetail(item);
    grid.appendChild(card);
  });
}

function openDetail(item) {
  state.currentItem = item;
  closePlayerMechanics();

  document.getElementById('detail-backdrop').style.backgroundImage = `url('${item.portada || ''}')`;
  document.getElementById('detail-title').textContent = item.titulo;
  
  const isSerie = item.tipo === 'serie';
  document.getElementById('detail-duration-lbl').textContent = isSerie ? '3 temporadas' : '1h 56m';
  document.getElementById('detail-desc').textContent = "Sinopsis oficial no disponible en este momento. Explora las temporadas o reproduce directamente el flujo de streaming sincronizado.";

  document.getElementById('btn-play-main').style.display = isSerie ? 'none' : 'block';
  document.getElementById('detail-overlay').style.display = 'flex';
}

function closeDetail() {
  closePlayerMechanics();
  document.getElementById('detail-overlay').style.display = 'none';
}

async function playMain() {
  if (!state.currentItem) return;
  
  document.getElementById('detail-backdrop').style.display = 'none';
  document.getElementById('embedded-player-container').style.display = 'block';
  
  document.getElementById('btn-play-main').style.display = 'none';
  document.getElementById('btn-rotate-screen').style.display = 'inline-flex';

  initPlyr();

  try {
    const res = await fetch(`${getServer()}/resolver?url=${encodeURIComponent(state.currentItem.url)}`);
    const data = await res.json();
    const streamUrl = `${getServer()}/stream?url=${encodeURIComponent(data.original || data.url)}`;
    
    const video = document.getElementById('video-player');
    if (state.hls) state.hls.destroy();

    if (Hls.isSupported()) {
      const hls = new Hls();
      hls.loadSource(streamUrl);
      hls.attachMedia(video);
      state.hls = hls;
      hls.on(Hls.Events.MANIFEST_PARSED, () => state.plyrInstance.play());
    } else {
      video.src = streamUrl;
      video.play();
    }
  } catch (e) {
    alert("Error al sincronizar el stream.");
    closePlayerMechanics();
  }
}

function toggleScreenOrientation() {}

function closePlayerMechanics() {
  if (state.plyrInstance) state.plyrInstance.stop();
  if (state.hls) { state.hls.destroy(); state.hls = null; }
  
  document.getElementById('detail-backdrop').style.display = 'block';
  document.getElementById('embedded-player-container').style.display = 'none';
  document.getElementById('btn-rotate-screen').style.display = 'none';
  if(state.currentItem && state.currentItem.tipo !== 'serie') {
    document.getElementById('btn-play-main').style.display = 'block';
  }
}

loadCatalog('peliculas');
</script>
</body>
</html>
