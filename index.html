<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Cinema STRANGER</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
  <style>
    /* ==========================================
       CINEMA STRANGER — Cinematic Dark Redesign
       ========================================== */

    :root {
      --bg:        #080808;
      --bg-card:   #0f0f0f;
      --bg-panel:  #111111;
      --accent:    #c8102e;
      --accent2:   #ff3350;
      --gold:      #c9a84c;
      --text:      #e8e0d5;
      --text-dim:  #7a7065;
      --text-mid:  #b0a898;
      --border:    rgba(200,16,46,0.25);
      --border-sub: rgba(255,255,255,0.07);
      --glass:     rgba(255,255,255,0.04);
      --success:   #4caf7d;
      --shadow:    0 20px 60px rgba(0,0,0,0.8);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Crimson Pro', Georgia, serif;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* ---- GRAIN TEXTURE ---- */
    .grain-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-size: 200px;
    }

    /* ==========================================
       NAVBAR
       ========================================== */
    .navbar {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 2000;
      background: linear-gradient(to bottom, rgba(8,8,8,0.98) 0%, rgba(8,8,8,0.85) 100%);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-sub);
    }

    .nav-content {
      display: flex;
      align-items: center;
      gap: 30px;
      padding: 0 5%;
      height: 64px;
    }

    /* LOGO */
    .logo {
      cursor: pointer;
      display: flex;
      flex-direction: column;
      line-height: 1;
      letter-spacing: 0.08em;
      flex-shrink: 0;
      user-select: none;
    }

    .logo-cinema {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1rem;
      color: var(--text-dim);
      letter-spacing: 0.35em;
    }

    .logo-strange {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.7rem;
      color: var(--accent);
      letter-spacing: 0.1em;
      line-height: 0.9;
    }

    /* NAV LINKS */
    .nav-links {
      display: flex;
      gap: 4px;
      flex: 1;
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      padding: 6px 14px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      transition: color 0.2s, background 0.2s;
      border-radius: 3px;
      position: relative;
    }

    .nav-btn:hover { color: var(--text); }

    .nav-btn.active {
      color: var(--accent);
      background: rgba(200,16,46,0.08);
    }

    .nav-btn.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 14px;
      right: 14px;
      height: 2px;
      background: var(--accent);
      border-radius: 1px;
    }

    /* SEARCH */
    .search-bar {
      position: relative;
      margin-left: auto;
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 15px;
      height: 15px;
      color: var(--text-dim);
      pointer-events: none;
    }

    .search-bar input {
      background: var(--glass);
      border: 1px solid var(--border-sub);
      color: var(--text);
      padding: 8px 15px 8px 38px;
      border-radius: 4px;
      outline: none;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      width: 200px;
      transition: border-color 0.2s, width 0.3s;
    }

    .search-bar input:focus {
      border-color: var(--accent);
      width: 260px;
    }

    .search-bar input::placeholder { color: var(--text-dim); }

    /* HAMBURGER */
    .hamburger {
      display: none;
      flex-direction: column;
      gap: 5px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px;
      margin-left: auto;
    }
    .hamburger span {
      display: block;
      width: 22px;
      height: 2px;
      background: var(--text-mid);
      border-radius: 2px;
      transition: 0.3s;
    }

    /* MOBILE MENU */
    .mobile-menu {
      padding: 16px 5% 20px;
      border-top: 1px solid var(--border-sub);
      background: rgba(8,8,8,0.98);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .mobile-nav-btn {
      background: none;
      border: none;
      color: var(--text-mid);
      text-align: left;
      padding: 10px 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      border-bottom: 1px solid var(--border-sub);
      transition: color 0.2s;
    }
    .mobile-nav-btn:hover { color: var(--accent); }

    .mobile-search input {
      margin-top: 12px;
      width: 100%;
      background: var(--glass);
      border: 1px solid var(--border-sub);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 4px;
      outline: none;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
    }

    /* ==========================================
       LOADER
       ========================================== */
    .loader-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .loader-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .film-reel {
      width: 56px;
      height: 56px;
      border: 2px solid rgba(200,16,46,0.3);
      border-top-color: var(--accent);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: spin 1.2s ease-in-out infinite;
      position: relative;
    }

    .reel-hole {
      position: absolute;
      width: 8px;
      height: 8px;
      background: var(--accent);
      border-radius: 50%;
    }
    .reel-hole:nth-child(1) { top: 4px; left: 50%; transform: translateX(-50%); }
    .reel-hole:nth-child(2) { bottom: 4px; left: 8px; }
    .reel-hole:nth-child(3) { bottom: 4px; right: 8px; }

    .loader-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.5em;
      color: var(--text-dim);
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }

    /* ==========================================
       HERO SLIDER
       ========================================== */
    .hero-slider {
      width: 100%;
      margin-top: 64px;
      background: linear-gradient(to bottom, #000 0%, var(--bg) 100%);
      overflow-x: auto;
      overflow-y: hidden;
      white-space: nowrap;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      position: relative;
      padding: 20px 0 14px;
    }

    .hero-slider::-webkit-scrollbar { display: none; }

    .slider-fade-left,
    .slider-fade-right {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 80px;
      z-index: 10;
      pointer-events: none;
    }
    .slider-fade-left  { left: 0;  background: linear-gradient(to right, var(--bg), transparent); }
    .slider-fade-right { right: 0; background: linear-gradient(to left,  var(--bg), transparent); }

    .slider-wrapper {
      display: inline-flex;
      gap: 10px;
      padding: 0 5%;
    }

    .slider-wrapper img {
      width: 110px;
      height: 165px;
      object-fit: cover;
      border-radius: 6px;
      scroll-snap-align: start;
      transition: transform 0.25s, filter 0.25s;
      filter: brightness(0.75) saturate(0.8);
      cursor: pointer;
    }

    .slider-wrapper img:hover {
      transform: scale(1.08) translateY(-3px);
      filter: brightness(1) saturate(1);
    }

    /* ==========================================
       GENRE BAR
       ========================================== */
    .generos-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 14px 5%;
      background: transparent;
      position: relative;
      z-index: 100;
      border-bottom: 1px solid var(--border-sub);
      margin-bottom: 8px;
    }

    .genero-btn {
      background: transparent;
      border: 1px solid var(--border-sub);
      color: var(--text-dim);
      padding: 5px 16px;
      border-radius: 2px;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: all 0.2s;
    }

    .genero-btn:hover {
      color: var(--text);
      border-color: rgba(255,255,255,0.2);
    }

    .genero-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    /* ==========================================
       MAIN CONTAINER & SECTIONS
       ========================================== */
    .container {
      padding: 32px 5% 60px;
      min-height: 80vh;
    }

    .category-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.2rem;
      letter-spacing: 0.08em;
      color: var(--text);
      margin-bottom: 24px;
      display: flex;
      align-items: baseline;
      gap: 14px;
      font-weight: 400;
    }

    .title-number {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      letter-spacing: 0.2em;
      color: var(--accent);
      opacity: 0.7;
      align-self: center;
    }

    /* ==========================================
       MOVIE GRID & CARDS
       ========================================== */
    .movie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 16px;
    }

    .card {
      position: relative;
      border-radius: 5px;
      overflow: hidden;
      cursor: pointer;
      background: var(--bg-card);
      transition: transform 0.25s cubic-bezier(0.25,0.46,0.45,0.94),
                  box-shadow 0.25s;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 2;
      background: linear-gradient(
        to bottom,
        transparent 50%,
        rgba(200,16,46,0.06) 100%
      );
      opacity: 0;
      transition: opacity 0.3s;
    }

    .card:hover {
      transform: translateY(-6px) scale(1.02);
      box-shadow: 0 16px 40px rgba(0,0,0,0.7), 0 0 0 1px var(--border);
    }

    .card:hover::before { opacity: 1; }

    .card img {
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover;
      display: block;
      transition: filter 0.3s;
    }

    .card p {
      position: absolute;
      bottom: 0;
      width: 100%;
      box-sizing: border-box;
      background: linear-gradient(transparent, rgba(0,0,0,0.92) 70%);
      margin: 0;
      padding: 28px 10px 10px;
      font-family: 'Crimson Pro', serif;
      font-size: 0.88rem;
      text-align: center;
      z-index: 3;
    }

    /* VISTO BADGE */
    .badge-visto {
      position: absolute;
      top: 8px;
      right: 8px;
      background: var(--success);
      color: #fff;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 400;
      z-index: 10;
      opacity: 0;
      transform: scale(0.5);
      transition: opacity 0.25s, transform 0.25s;
    }

    .card.visto .badge-visto {
      opacity: 1;
      transform: scale(1);
    }

    .card.visto img {
      filter: brightness(0.35) saturate(0);
    }

    .card.visto:hover img {
      filter: brightness(0.55) saturate(0.4);
    }

    /* ==========================================
       MOVIE DETAIL VIEW
       ========================================== */
    .movie-detail-layout {
      display: grid;
      grid-template-columns: 200px 1fr;
      gap: 24px;
      background: var(--bg-panel);
      border: 1px solid var(--border-sub);
      border-radius: 8px;
      padding: 24px;
      margin-top: 20px;
      align-items: start;
    }

    .movie-detail-poster img {
      width: 100%;
      border-radius: 6px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      display: block;
    }

  .movie-detail-video {
  min-height: 200px;
  width: 100%;
}

.movie-detail-video iframe {
  width: 100%;
  aspect-ratio: 16 / 9;
  min-height: 200px;  /* ← esto es lo crítico */
  border-radius: 6px;
  background: #000;
  border: none;
  display: block;
}

    .movie-info-adicional {
      grid-column: 1 / -1;
      margin-top: 4px;
      padding: 20px;
      background: var(--glass);
      border: 1px solid var(--border-sub);
      border-radius: 6px;
    }

    .sinopsis {
      font-family: 'Crimson Pro', serif;
      font-size: 1.05rem;
      font-style: italic;
      color: var(--text-mid);
      line-height: 1.7;
      margin-bottom: 10px;
    }

    .director, .actores {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--text-dim);
      margin: 4px 0;
      letter-spacing: 0.05em;
    }

    .movie-detail-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.15rem;
      letter-spacing: 0.08em;
      color: var(--text);
      font-weight: 400;
      line-height: 1.25;
      margin: 0 0 10px 0;
      padding: 0 0 0 8px;
      border-left: 2px solid var(--accent);
    }

    /* SIMILARES */
    .similares-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 12px;
      margin-top: 16px;
    }

    .similares-card {
      cursor: pointer;
      border-radius: 4px;
      overflow: hidden;
      background: var(--bg-card);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .similares-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    }

    .similares-card img {
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover;
      display: block;
      filter: brightness(0.8);
      transition: filter 0.2s;
    }
    .similares-card:hover img { filter: brightness(1); }

    .similares-card p {
      position: static;
      background: none;
      padding: 6px 6px 8px;
      font-family: 'Crimson Pro', serif;
      font-size: 0.78rem;
      color: var(--text-dim);
      text-align: center;
      line-height: 1.2;
    }

    /* ==========================================
       TV EN VIVO
       ========================================== */
    .tv-live-badge {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      padding: 4px 10px;
      border-radius: 2px;
      margin-bottom: 14px;
      animation: pulse 1.5s ease-in-out infinite;
    }

    .tv-player {
      position: relative;
      width: 100%;
      margin-top: 10px;
    }

    .tv-player iframe {
      width: 100%;
      aspect-ratio: 16/9;
      border-radius: 8px;
      border: none;
      display: block;
    }

    /* ==========================================
       BACK BUTTON
       ========================================== */
    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: transparent;
      color: var(--text-mid);
      border: 1px solid var(--border-sub);
      padding: 8px 18px;
      border-radius: 4px;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 24px;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
    }

    .btn-back:hover {
      color: var(--text);
      border-color: var(--accent);
      background: rgba(200,16,46,0.06);
    }

    /* ==========================================
       FOOTER ACTIONS
       ========================================== */
    .footer-actions {
      text-align: center;
      padding: 60px 20px 40px;
    }

    .btn-borrar {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: transparent;
      color: var(--text-dim);
      border: 1px solid rgba(255,255,255,0.08);
      padding: 10px 22px;
      border-radius: 4px;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: all 0.25s;
    }

    .btn-borrar:hover {
      color: var(--text);
      border-color: var(--accent);
      background: rgba(200,16,46,0.06);
    }

    /* ==========================================
       VIDEO OVERLAY PLAYER
       ========================================== */
    .video-overlay {
      position: fixed;
      inset: 0;
      z-index: 3000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .video-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.95);
      cursor: pointer;
    }

    .video-container {
      position: relative;
      z-index: 1;
      width: 90%;
      max-width: 1000px;
      aspect-ratio: 16/9;
    }

    .video-container iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 6px;
      display: block;
    }

    .btn-close {
      position: absolute;
      top: -44px;
      right: 0;
      color: var(--text-mid);
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border-sub);
      border-radius: 4px;
      width: 36px;
      height: 36px;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s, background 0.2s;
    }

    .btn-close:hover {
      color: var(--text);
      background: rgba(200,16,46,0.2);
    }

    /* ==========================================
       UTILITY
       ========================================== */
    .hidden { display: none !important; }

    /* ==========================================
       RESPONSIVE
       ========================================== */
    @media (max-width: 768px) {
      .nav-links   { display: none; }
      .search-bar  { display: none; }
      .hamburger   { display: flex; }

      .hero-slider { margin-top: 64px; }

      .movie-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .movie-detail-layout {
        grid-template-columns: 1fr;
      }

      .movie-detail-video {
        grid-column: 1;
      }

      .category-title { font-size: 1.7rem; }
    }

    @media (max-width: 480px) {
      .movie-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }

      .container { padding: 24px 4% 50px; }

      .slider-wrapper img {
        width: 90px;
        height: 135px;
      }

      .movie-detail-layout { padding: 16px; gap: 16px; }

      .movie-detail-poster { max-width: 160px; margin: 0 auto; }

      .movie-info-adicional { padding: 14px; }
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card {
      animation: cardIn 0.35s ease forwards;
    }
  </style>
</head>
<body>

<!-- SPINNER DE CARGA -->
<div id="loader" class="loader-overlay">
  <div class="loader-inner">
    <div class="film-reel">
      <div class="reel-hole"></div>
      <div class="reel-hole"></div>
      <div class="reel-hole"></div>
    </div>
    <div class="loader-text">CARGANDO</div>
  </div>
</div>

<!-- GRAIN OVERLAY -->
<div class="grain-overlay"></div>

<nav class="navbar">
  <div class="nav-content">
    <div class="logo" onclick="mostrarSeccion('peliculas')">
      <span class="logo-cinema">CINEMA</span>
      <span class="logo-strange">STRANGER</span>
    </div>
    <div class="nav-links">
      <button onclick="mostrarSeccion('peliculas')" data-section="peliculas" class="nav-btn active">Películas</button>
      <button onclick="mostrarSeccion('series')" data-section="series" class="nav-btn">Series</button>
      <button onclick="mostrarSeccion('novelas')" data-section="novelas" class="nav-btn">Novelas</button>
      <button onclick="mostrarSeccion('tv')" data-section="tv" class="nav-btn">TV en Vivo</button>
    </div>
    <div class="search-bar">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="buscador" placeholder="Buscar título..." onkeyup="filtrarContenido()">
    </div>
    <button class="hamburger" id="hamburger" onclick="toggleMenu()">
      <span></span><span></span><span></span>
    </button>
  </div>
  <!-- Mobile menu -->
  <div class="mobile-menu hidden" id="mobile-menu">
    <button onclick="mostrarSeccion('peliculas'); toggleMenu()" class="mobile-nav-btn">Películas</button>
    <button onclick="mostrarSeccion('series'); toggleMenu()" class="mobile-nav-btn">Series</button>
    <button onclick="mostrarSeccion('novelas'); toggleMenu()" class="mobile-nav-btn">Novelas</button>
    <button onclick="mostrarSeccion('tv'); toggleMenu()" class="mobile-nav-btn">TV en Vivo</button>
    <div class="mobile-search">
      <input type="text" id="buscador-mobile" placeholder="Buscar..." oninput="document.getElementById('buscador').value=this.value; filtrarContenido()">
    </div>
  </div>
</nav>

<header id="header-slider" class="hero-slider">
  <div class="slider-fade-left"></div>
  <div id="slider" class="slider-wrapper"></div>
  <div class="slider-fade-right"></div>
</header>

<main class="container">
  <!-- Sección Películas -->
  <section id="sec-peliculas" class="content-section">
    <h2 class="category-title"><span class="title-number">01</span>Películas</h2>
    <div id="grid-peliculas" class="movie-grid"></div>
  </section>

  <!-- Sección Series -->
  <section id="sec-series" class="content-section hidden">
    <h2 class="category-title"><span class="title-number">02</span>Series</h2>
    <div id="grid-series" class="movie-grid"></div>
  </section>

  <!-- Sección Novelas -->
  <section id="sec-novelas" class="content-section hidden">
    <h2 class="category-title"><span class="title-number">03</span>Novelas</h2>
    <div id="grid-novelas" class="movie-grid"></div>
  </section>

  <!-- Sección TV en Vivo -->
  <section id="sec-tv" class="content-section hidden">
    <h2 class="category-title"><span class="title-number">04</span>TV en Vivo</h2>
    <div class="tv-player">
      <div class="tv-live-badge">● EN VIVO</div>
      <iframe src="https://www.youtube.com/embed/t8HuqJeu6LE" title="TV en Vivo" frameborder="0" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen="true"></iframe>
    </div>
  </section>

  <!-- Vista de detalles para episodios -->
  <section id="vista-detalles" class="content-section hidden">
    <button class="btn-back" onclick="volver()"><span>←</span> Regresar</button>
    <h2 id="detalle-titulo" class="category-title"></h2>
    <div id="grid-detalles" class="movie-grid"></div>
  </section>

  <!-- Vista: Detalle de película -->
  <section id="sec-movie-detail" class="content-section hidden">
    <button class="btn-back" onclick="volver()"><span>←</span> Regresar</button>
    <div id="movie-detail-container" class="movie-detail-layout"></div>
  </section>

  <div class="footer-actions">
    <button class="btn-borrar" onclick="borrarHistorial()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="16"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>
      Limpiar videos vistos
    </button>
  </div>
</main>

<!-- REPRODUCTOR FLOTANTE -->
<div id="player" class="video-overlay hidden">
  <div class="video-backdrop" onclick="cerrarPlayer()"></div>
  <div class="video-container">
    <button class="btn-close" onclick="cerrarPlayer()">✕</button>
    <iframe id="videoFrame" src="" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen="true"></iframe>
  </div>
</div>

<script>
function toggleMenu() {
  const m = document.getElementById('mobile-menu');
  m.classList.toggle('hidden');
}

document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});

/* ====== DATOS ====== */
let peliculas = [];
let series    = {};
let novelas   = {};

/* ====== SPINNER ====== */
function ocultarLoader() {
  const loader = document.getElementById('loader');
  if (loader) loader.style.display = 'none';
}

/* ====== NORMALIZAR TÍTULOS ====== */
function normalizarTexto(texto) {
  return texto.toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .trim();
}

function eliminarDuplicados(lista) {
  const vistosTitulos = new Set();
  return lista.filter(peli => {
    const tituloNorm = normalizarTexto(peli.titulo);
    if (vistosTitulos.has(tituloNorm)) return false;
    vistosTitulos.add(tituloNorm);
    return true;
  });
}

/* ====== CARGA DEL CATÁLOGO ====== */
async function cargarCatalogo() {
  try {
    const res = await fetch(`catalogo.json?v=${Date.now()}`);
    const data = await res.json();
    peliculas = eliminarDuplicados(data.peliculas || []);
    series    = data.series   || {};
    novelas   = data.novelas  || {};
    console.log(`Cargadas ${peliculas.length} películas únicas.`);
  } catch (e) {
    console.error('Error cargando catalogo.json:', e);
  } finally {
    ocultarLoader();
  }
}

/* ====== VISTOS ====== */
let vistos = JSON.parse(localStorage.getItem('vistos_strange')) || [];

function marcarVisto(id) {
  if (!id || vistos.includes(id)) return;
  vistos.push(id);
  localStorage.setItem('vistos_strange', JSON.stringify(vistos));
  document.querySelectorAll(`.card[data-id="${id}"]`).forEach(card => card.classList.add('visto'));
}

function borrarHistorial() {
  if (confirm("¿Seguro que quieres borrar todas las marcas de 'visto'?")) {
    vistos = [];
    localStorage.removeItem('vistos_strange');
    document.querySelectorAll('.card').forEach(card => card.classList.remove('visto'));
    alert("Historial borrado.");
  }
}

/* ====== NAVEGACIÓN ====== */
let seccionActual = 'peliculas';

function mostrarSeccion(seccion) {
  seccionActual = seccion;
  document.querySelectorAll('.content-section').forEach(s => s.classList.add('hidden'));
  const target = document.getElementById(`sec-${seccion}`);
  if (target) target.classList.remove('hidden');
  
  const hero = document.getElementById('header-slider');
  hero.style.display = (seccion === 'peliculas') ? 'block' : 'none';
  
  document.getElementById('buscador').value = "";
  document.querySelectorAll('.card').forEach(c => c.style.display = "block");
  
  const generosBar = document.getElementById('generos-container');
  if (generosBar) {
    generosBar.style.display = (seccion === 'peliculas') ? 'flex' : 'none';
  }
}

function volver() {
  mostrarSeccion(seccionActual);
}

/* ====== CLASIFICACIÓN POR GÉNEROS ====== */
function asignarGenero(pelicula) {
  const titulo = normalizarTexto(pelicula.titulo);
  if (titulo.includes('telefono negro') || titulo.includes('el abismo secreto') || titulo.includes('doctor sueño') ||
      titulo.includes('five nights') || titulo.includes('el resplandor') || titulo.includes('destino final') ||
      titulo.includes('the sand') || titulo.includes('exterminio') || titulo.includes('el conjuro') ||
      titulo.includes('chucky') || titulo.includes('terrifier') || titulo.includes('silent hill') ||
      titulo.includes('muneco diabolico') || titulo.includes('tarot') || titulo.includes('the room') ||
      titulo.includes('gretel') || titulo.includes('la novia de chucky') || titulo.includes('el hijo de chucky') ||
      titulo.includes('la hermanastra fea') || titulo.includes('scream') || titulo.includes('return to silent hill') ||
      titulo.includes('the jester') || titulo.includes('pecadores')) {
    return 'Terror';
  }
  if (titulo.includes('yo antes de ti') || titulo.includes('cosas imposibles') || titulo.includes('caramelo') ||
      titulo.includes('verdad y traicion') || titulo.includes('soy frankela') || titulo.includes('sonido de libertad') ||
      titulo.includes('babel') || titulo.includes('dejar el mundo atras') || titulo.includes('trust') ||
      titulo.includes('asi en la tierra') || titulo.includes('el dia que todo cambio') || titulo.includes('together')) {
    return 'Drama';
  }
  if (titulo.includes('tron ares') || titulo.includes('apocalypto') || titulo.includes('4 fantasticos') ||
      titulo.includes('pearl harbor') || titulo.includes('la torre oscura') || titulo.includes('crimen perfecto') ||
      titulo.includes('pantera negra') || titulo.includes('eyes of wakanda') || titulo.includes('estado electrico') ||
      titulo.includes('mario galaxy') || titulo.includes('the dinosaur proyect') || titulo.includes('la torre obscura') ||
      titulo.includes('michael jackson')) {
    return 'Acción';
  }
  if (titulo.includes('bambi') || titulo.includes('como entrenar a tu dragon') || titulo.includes('sobinor') ||
      titulo.includes('onward') || titulo.includes('mufasa') || titulo.includes('robot salvaje') ||
      titulo.includes('harry potter')) {
    return 'Animación';
  }
  if (titulo.includes('first moon') || titulo.includes('exterminio la evolucion') || titulo.includes('28 semanas') ||
      titulo.includes('estado electrico')) {
    return 'Ciencia Ficción';
  }
  return 'Otros';
}

function obtenerPeliculasPorGenero() {
  const generos = {};
  peliculas.forEach(peli => {
    const gen = asignarGenero(peli);
    if (!generos[gen]) generos[gen] = [];
    generos[gen].push(peli);
  });
  return generos;
}

function renderizarGeneros() {
  const generosMap = obtenerPeliculasPorGenero();
  const generosList = Object.keys(generosMap).sort();
  
  let generosContainer = document.getElementById('generos-container');
  if (!generosContainer) {
    generosContainer = document.createElement('div');
    generosContainer.id = 'generos-container';
    generosContainer.className = 'generos-bar';
    const navbar = document.querySelector('.navbar');
    navbar.parentNode.insertBefore(generosContainer, navbar.nextSibling);
  }
  generosContainer.innerHTML = '<button class="genero-btn active" data-genero="todos">🎬 Todos</button>';
  generosList.forEach(gen => {
    const btn = document.createElement('button');
    btn.className = 'genero-btn';
    btn.textContent = gen;
    btn.setAttribute('data-genero', gen);
    generosContainer.appendChild(btn);
  });
  
  document.querySelectorAll('.genero-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      document.querySelectorAll('.genero-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const generoSeleccionado = btn.getAttribute('data-genero');
      filtrarPeliculasPorGenero(generoSeleccionado);
    });
  });
  
  window.generosMap = generosMap;
  generosContainer.style.display = (seccionActual === 'peliculas') ? 'flex' : 'none';
}

function filtrarPeliculasPorGenero(genero) {
  const grid = document.getElementById('grid-peliculas');
  grid.innerHTML = '';
  let pelisAMostrar = [];
  if (genero === 'todos') {
    pelisAMostrar = [...peliculas].sort((a,b) => a.titulo.localeCompare(b.titulo));
  } else {
    pelisAMostrar = (window.generosMap[genero] || []).sort((a,b) => a.titulo.localeCompare(b.titulo));
  }
  pelisAMostrar.forEach(peli => {
    const card = crearCard(peli.titulo, peli.portada, () => mostrarDetallePelicula(peli), peli.id, peli.idiomas);
    grid.appendChild(card);
  });
}

/* ====== REPRODUCTOR ====== */
function abrirReproductor(id) {
  const frame = document.getElementById('videoFrame');
  frame.src = `https://drive.google.com/file/d/${id}/preview`;
  document.getElementById('player').classList.remove('hidden');
}

function cerrarPlayer() {
  document.getElementById('player').classList.add('hidden');
  document.getElementById('videoFrame').src = "";
}

/* ====== VISTA DETALLE DE PELÍCULA ====== */
function mostrarDetallePelicula(peli) {
  document.querySelectorAll('.content-section').forEach(s => s.classList.add('hidden'));
  const detailSection = document.getElementById('sec-movie-detail');
  detailSection.classList.remove('hidden');

  const hero = document.getElementById('header-slider');
  hero.style.display = 'none';
  const generosBar = document.getElementById('generos-container');
  if (generosBar) generosBar.style.display = 'none';

  let defaultId = peli.id;
  if (peli.idiomas && peli.idiomas.length) defaultId = peli.idiomas[0].id;

  const generoActual = asignarGenero(peli);
  const similares = peliculas
    .filter(p => asignarGenero(p) === generoActual && normalizarTexto(p.titulo) !== normalizarTexto(peli.titulo))
    .slice(0, 8);

  const container = document.getElementById('movie-detail-container');
  container.innerHTML = `
    <div style="display:flex; flex-direction:column; gap:20px; width:100%;">

      <!-- VIDEO ARRIBA FULL WIDTH -->
      <div style="width:100%; background:#000; border-radius:8px; overflow:hidden;">
        <iframe
          src="https://drive.google.com/file/d/${defaultId}/preview"
          style="width:100%; aspect-ratio:16/9; min-height:200px; display:block; border:none;"
          allow="autoplay; fullscreen; picture-in-picture"
          allowfullscreen>
        </iframe>
      </div>

      <!-- POSTER + INFO LADO A LADO -->
      <div style="display:flex; gap:20px; align-items:flex-start;">
        <img src="${peli.portada}" alt="${peli.titulo}"
          style="width:120px; flex-shrink:0; border-radius:6px; box-shadow:0 8px 24px rgba(0,0,0,0.6);">
        <div>
          <h3 style="font-family:'Bebas Neue',sans-serif; font-size:1.6rem; letter-spacing:0.08em;
            border-left:3px solid var(--accent); padding-left:10px; margin-bottom:10px;">
            ${peli.titulo}
          </h3>
          <p class="sinopsis">${peli.sinopsis ? '📖 ' + peli.sinopsis : '🎬 Disfruta de esta película en Cinema STRANGER'}</p>
          ${peli.director ? `<div class="director"><strong>DIRECTOR:</strong> ${peli.director}</div>` : ''}
          ${peli.actores  ? `<div class="actores"><strong>REPARTO:</strong> ${peli.actores}</div>`   : ''}
        </div>
      </div>

      <!-- SIMILARES -->
      ${similares.length ? `
        <div>
          <h4 style="font-family:'Bebas Neue',sans-serif; letter-spacing:0.08em; margin-bottom:12px;">
            🎬 PELÍCULAS SIMILARES
          </h4>
          <div class="similares-grid" id="similaresGrid"></div>
        </div>` : ''}

    </div>
  `;

  marcarVisto(defaultId);

  const similaresGrid = document.getElementById('similaresGrid');
  if (similaresGrid) {
    similares.forEach(sim => {
      const card = document.createElement('div');
      card.className = 'similares-card';
      card.innerHTML = `<img src="${sim.portada}" loading="lazy"><p>${sim.titulo}</p>`;
      card.onclick = () => mostrarDetallePelicula(sim);
      similaresGrid.appendChild(card);
    });
  }

  window.scrollTo(0, 0);
}
  
  container.innerHTML = html;
  marcarVisto(defaultId);
  
  const similaresGrid = document.getElementById('similaresGrid');
  if (similaresGrid) {
    similares.forEach(sim => {
      const card = document.createElement('div');
      card.className = 'similares-card';
      card.innerHTML = `<img src="${sim.portada}" loading="lazy"><p>${sim.titulo}</p>`;
      card.onclick = () => mostrarDetallePelicula(sim);
      similaresGrid.appendChild(card);
    });
  }
}

/* ====== VISTA DETALLE PARA SERIES/NOVELAS ====== */
function verDetalle(titulo, lista) {
  document.querySelectorAll('.content-section').forEach(s => s.classList.add('hidden'));
  const vista = document.getElementById('vista-detalles');
  vista.classList.remove('hidden');
  document.getElementById('detalle-titulo').innerText = titulo;
  
  const hero = document.getElementById('header-slider');
  hero.style.display = 'none';
  const generosBar = document.getElementById('generos-container');
  if (generosBar) generosBar.style.display = 'none';
  
  const grid = document.getElementById('grid-detalles');
  grid.innerHTML = "";
  lista.forEach(item => {
    grid.appendChild(crearCard(item.titulo, item.portada, () => abrirReproductor(item.id), item.id));
  });
  window.scrollTo(0, 0);
}

/* ====== CREAR TARJETA ====== */
function crearCard(titulo, portada, accion, id = null, idiomas = null) {
  const div = document.createElement('div');
  div.className = 'card';
  if (id && vistos.includes(id)) div.classList.add('visto');
  if (id) div.setAttribute('data-id', id);

  let badgeIdiomas = '';
  if (idiomas && idiomas.length > 1) {
    badgeIdiomas = `<span style="position:absolute; bottom:5px; left:5px; background:#e50914; padding:2px 6px; border-radius:12px; font-size:10px; z-index:10;">🎧 ${idiomas.length}</span>`;
  }

  div.innerHTML = `
    <div class="badge-visto">✓</div>
    <img src="${portada}" loading="lazy" onerror="this.src='https://via.placeholder.com/150x225?text=No+Image'">
    <p>${titulo}</p>
    ${badgeIdiomas}
  `;

  div.onclick = (e) => {
    e.stopPropagation();
    if (typeof accion === 'function') accion();
  };
  return div;
}

/* ====== RENDER PRINCIPAL ====== */
function cargarTodo() {
  renderizarGeneros();
  filtrarPeliculasPorGenero('todos');

  const gs = document.getElementById('grid-series');
  if (gs) {
    gs.innerHTML = '';
    Object.keys(series).forEach(s => {
      const primeraPortada = series[s][0]?.portada || '';
      const card = crearCard(s, primeraPortada, () => verDetalle(s, series[s]));
      gs.appendChild(card);
    });
  }

  const gn = document.getElementById('grid-novelas');
  if (gn) {
    gn.innerHTML = '';
    Object.keys(novelas).forEach(n => {
      const primeraPortada = novelas[n][0]?.portada || '';
      const card = crearCard(n, primeraPortada, () => verDetalle(n, novelas[n]));
      gn.appendChild(card);
    });
  }
}

/* ====== BUSCADOR ====== */
function filtrarContenido() {
  const q = document.getElementById('buscador').value.toLowerCase();
  const activa = document.querySelector('.content-section:not(.hidden)');
  if (!activa) return;
  activa.querySelectorAll('.card').forEach(c => {
    const tituloCard = c.querySelector('p')?.innerText?.toLowerCase() || '';
    c.style.display = tituloCard.includes(q) ? "block" : "none";
  });
}

/* ====== CARRUSEL ====== */
function initSlider() {
  const wrapper = document.getElementById('slider');
  if (!wrapper) return;
  wrapper.innerHTML = '';
  let portadasUnicas = [...new Set(peliculas.map(p => p.portada))].slice(0, 15);
  portadasUnicas.forEach(ruta => {
    const img = document.createElement('img');
    img.src = ruta;
    img.onerror = () => img.style.display = 'none';
    img.onclick = () => {
      const peliEncontrada = peliculas.find(p => p.portada === ruta);
      if (peliEncontrada) mostrarDetallePelicula(peliEncontrada);
    };
    wrapper.appendChild(img);
  });
}

/* ====== INICIO ====== */
document.addEventListener("DOMContentLoaded", async () => {
  await cargarCatalogo();
  initSlider();
  cargarTodo();
});
</script>
</body>
</html>
