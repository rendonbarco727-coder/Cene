<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Cinema STRANGER</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #080808;
      --bg-card: #0f0f0f;
      --bg-panel: #111111;
      --accent: #c8102e;
      --text: #e8e0d5;
      --text-dim: #7a7065;
      --text-mid: #b0a898;
      --border-sub: rgba(255,255,255,0.07);
      --glass: rgba(255,255,255,0.04);
      --success: #4caf7d;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Crimson Pro', Georgia, serif;
      overflow-x: hidden;
    }

    .grain-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-size: 200px;
    }

    /* NAVBAR */
    .navbar {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 2000;
      background: linear-gradient(to bottom, rgba(8,8,8,0.98), rgba(8,8,8,0.85));
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-sub);
    }

    .nav-content {
      display: flex;
      align-items: center;
      gap: 30px;
      padding: 0 5%;
      height: 64px;
    }

    .logo {
      cursor: pointer;
      display: flex;
      flex-direction: column;
      line-height: 1;
    }

    .logo-cinema {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1rem;
      color: var(--text-dim);
      letter-spacing: 0.35em;
    }

    .logo-strange {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.7rem;
      color: var(--accent);
      letter-spacing: 0.1em;
    }

    .nav-links {
      display: flex;
      gap: 4px;
      flex: 1;
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      padding: 6px 14px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      transition: color 0.2s;
    }

    .nav-btn:hover { color: var(--text); }
    .nav-btn.active { color: var(--accent); background: rgba(200,16,46,0.08); }

    /* SEARCH */
    .search-bar {
      position: relative;
      margin-left: auto;
    }

    .search-bar input {
      background: var(--glass);
      border: 1px solid var(--border-sub);
      color: var(--text);
      padding: 8px 15px 8px 38px;
      border-radius: 4px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      width: 200px;
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 15px;
      color: var(--text-dim);
    }

    /* HAMBURGER */
    .hamburger {
      display: none;
      flex-direction: column;
      gap: 5px;
      background: none;
      border: none;
      cursor: pointer;
    }
    .hamburger span {
      width: 22px;
      height: 2px;
      background: var(--text-mid);
      border-radius: 2px;
    }

    .mobile-menu {
      padding: 16px 5%;
      border-top: 1px solid var(--border-sub);
      background: rgba(8,8,8,0.98);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .mobile-nav-btn {
      background: none;
      border: none;
      color: var(--text-mid);
      padding: 10px 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      text-align: left;
      cursor: pointer;
      border-bottom: 1px solid var(--border-sub);
    }

    .mobile-search input {
      margin-top: 12px;
      width: 100%;
      background: var(--glass);
      border: 1px solid var(--border-sub);
      color: var(--text);
      padding: 10px;
      border-radius: 4px;
    }

    /* LOADER */
    .loader-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .film-reel {
      width: 56px;
      height: 56px;
      border: 2px solid rgba(200,16,46,0.3);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1.2s ease-in-out infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* HERO SLIDER */
    .hero-slider {
      width: 100%;
      margin-top: 64px;
      overflow-x: auto;
      white-space: nowrap;
      padding: 20px 0;
    }

    .hero-slider::-webkit-scrollbar { display: none; }

    .slider-wrapper {
      display: inline-flex;
      gap: 10px;
      padding: 0 5%;
    }

    .slider-wrapper img {
      width: 110px;
      height: 165px;
      object-fit: cover;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.25s;
    }

    .slider-wrapper img:hover {
      transform: scale(1.08);
    }

    /* GENRE BAR */
    .generos-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 14px 5%;
      border-bottom: 1px solid var(--border-sub);
    }

    .genero-btn {
      background: transparent;
      border: 1px solid var(--border-sub);
      color: var(--text-dim);
      padding: 5px 16px;
      border-radius: 2px;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      text-transform: uppercase;
    }

    .genero-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    /* MAIN */
    .container {
      padding: 32px 5% 60px;
    }

    .category-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.2rem;
      margin-bottom: 24px;
      display: flex;
      gap: 14px;
    }

    .title-number {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: var(--accent);
    }

    /* MOVIE GRID */
    .movie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 22px;
    }

    .card {
      position: relative;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      background: var(--bg-card);
      transition: transform 0.25s;
    }

    .card:hover {
      transform: translateY(-6px);
    }

    .card img {
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover;
    }

    .card p {
      position: absolute;
      bottom: 0;
      width: 100%;
      background: linear-gradient(transparent, rgba(0,0,0,0.92));
      padding: 28px 10px 10px;
      text-align: center;
    }

    .badge-visto {
      position: absolute;
      top: 8px;
      right: 8px;
      background: var(--success);
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      opacity: 0;
    }

    .card.visto .badge-visto { opacity: 1; }
    .card.visto img { filter: brightness(0.35); }

    /* BOTÓN DE REGRESO - ESTILO MEJORADO */
    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(200,16,46,0.15);
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 24px;
      transition: all 0.2s;
    }

    .btn-back:hover {
      background: var(--accent);
      color: white;
    }

    /* DETALLE PELÍCULA */
    .movie-detail-container {
      background: var(--bg-panel);
      border: 1px solid var(--border-sub);
      border-radius: 12px;
      padding: 24px;
      margin-top: 20px;
    }

    /* VIDEO RESPONSIVO */
    .video-wrapper {
      width: 100%;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .video-wrapper iframe {
      width: 100%;
      aspect-ratio: 16 / 9;
      display: block;
      border: none;
    }

    /* En móvil el video se ajusta automáticamente */
    @media (max-width: 768px) {
      .video-wrapper iframe {
        aspect-ratio: 16 / 9;
      }
    }

    .info-row {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
    }

    .poster-col {
      width: 160px;
      flex-shrink: 0;
    }

    .poster-col img {
      width: 100%;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }

    .info-col {
      flex: 1;
    }

    .movie-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2rem;
      border-left: 4px solid var(--accent);
      padding-left: 14px;
      margin-bottom: 16px;
    }

    .sinopsis {
      font-size: 1rem;
      font-style: italic;
      color: var(--text-mid);
      line-height: 1.6;
      margin-bottom: 14px;
    }

    .director, .actores {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      color: var(--text-dim);
      margin: 6px 0;
    }

    /* SIMILARES */
    .similares-section {
      margin-top: 32px;
    }

    .similares-title {
      font-family: 'Bebas Neue', sans-serif;
      color: var(--accent);
      margin-bottom: 16px;
      font-size: 1.2rem;
    }

    .similares-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 14px;
    }

    .similares-card {
      cursor: pointer;
      border-radius: 6px;
      overflow: hidden;
      background: var(--bg-card);
      transition: transform 0.2s;
    }

    .similares-card:hover {
      transform: translateY(-4px);
    }

    .similares-card img {
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover;
    }

    .similares-card p {
      padding: 8px 6px;
      font-size: 0.7rem;
      text-align: center;
    }

    /* TV EN VIVO */
    .tv-player iframe {
      width: 100%;
      aspect-ratio: 16/9;
      border-radius: 8px;
    }

    /* VIDEO OVERLAY */
    .video-overlay {
      position: fixed;
      inset: 0;
      z-index: 3000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .video-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.95);
      cursor: pointer;
    }

    .video-container {
      position: relative;
      width: 90%;
      max-width: 1000px;
      aspect-ratio: 16/9;
    }

    .video-container iframe {
      width: 100%;
      height: 100%;
      border-radius: 8px;
    }

    .btn-close {
      position: absolute;
      top: -44px;
      right: 0;
      background: rgba(255,255,255,0.1);
      border: none;
      color: white;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
    }

    /* FOOTER */
    .footer-actions {
      text-align: center;
      padding: 50px 20px 30px;
    }

    .btn-borrar {
      background: transparent;
      border: 1px solid var(--border-sub);
      color: var(--text-dim);
      padding: 10px 22px;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
    }

    .hidden { display: none !important; }

    @media (max-width: 768px) {
      .nav-links, .search-bar { display: none; }
      .hamburger { display: flex; }
      .movie-grid { grid-template-columns: repeat(2, 1fr); gap: 14px; }
      .category-title { font-size: 1.7rem; }
      .movie-title { font-size: 1.4rem; }
      .poster-col { width: 110px; }
      .similares-grid { grid-template-columns: repeat(3, 1fr); }
    }

    @media (max-width: 480px) {
      .poster-col { width: 90px; }
      .movie-title { font-size: 1.1rem; }
      .sinopsis { font-size: 0.8rem; }
      .similares-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

<div id="loader" class="loader-overlay">
  <div class="film-reel"></div>
</div>

<div class="grain-overlay"></div>

<nav class="navbar">
  <div class="nav-content">
    <div class="logo" onclick="mostrarSeccion('peliculas')">
      <span class="logo-cinema">CINEMA</span>
      <span class="logo-strange">STRANGER</span>
    </div>
    <div class="nav-links">
      <button onclick="mostrarSeccion('peliculas')" class="nav-btn active">Películas</button>
      <button onclick="mostrarSeccion('series')" class="nav-btn">Series</button>
      <button onclick="mostrarSeccion('novelas')" class="nav-btn">Novelas</button>
      <button onclick="mostrarSeccion('tv')" class="nav-btn">TV en Vivo</button>
    </div>
    <div class="search-bar">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="buscador" placeholder="Buscar..." onkeyup="filtrarContenido()">
    </div>
    <button class="hamburger" onclick="toggleMenu()">
      <span></span><span></span><span></span>
    </button>
  </div>
  <div class="mobile-menu hidden" id="mobile-menu">
    <button onclick="mostrarSeccion('peliculas'); toggleMenu()" class="mobile-nav-btn">Películas</button>
    <button onclick="mostrarSeccion('series'); toggleMenu()" class="mobile-nav-btn">Series</button>
    <button onclick="mostrarSeccion('novelas'); toggleMenu()" class="mobile-nav-btn">Novelas</button>
    <button onclick="mostrarSeccion('tv'); toggleMenu()" class="mobile-nav-btn">TV en Vivo</button>
    <input type="text" id="buscador-mobile" placeholder="Buscar..." oninput="document.getElementById('buscador').value=this.value; filtrarContenido()">
  </div>
</nav>

<header id="header-slider" class="hero-slider">
  <div id="slider" class="slider-wrapper"></div>
</header>

<main class="container">
  <section id="sec-peliculas" class="content-section">
    <h2 class="category-title"><span class="title-number">01</span>Películas</h2>
    <div id="grid-peliculas" class="movie-grid"></div>
  </section>

  <section id="sec-series" class="content-section hidden">
    <h2 class="category-title"><span class="title-number">02</span>Series</h2>
    <div id="grid-series" class="movie-grid"></div>
  </section>

  <section id="sec-novelas" class="content-section hidden">
    <h2 class="category-title"><span class="title-number">03</span>Novelas</h2>
    <div id="grid-novelas" class="movie-grid"></div>
  </section>

  <section id="sec-tv" class="content-section hidden">
    <h2 class="category-title"><span class="title-number">04</span>TV en Vivo</h2>
    <div class="tv-player">
      <iframe src="https://www.youtube.com/embed/t8HuqJeu6LE" allowfullscreen></iframe>
    </div>
  </section>

  <section id="vista-detalles" class="content-section hidden">
    <button class="btn-back" onclick="volver()">← REGRESAR</button>
    <h2 id="detalle-titulo" class="category-title"></h2>
    <div id="grid-detalles" class="movie-grid"></div>
  </section>

  <section id="sec-movie-detail" class="content-section hidden">
    <button class="btn-back" onclick="volver()">← REGRESAR</button>
    <div id="movie-detail-container" class="movie-detail-container"></div>
  </section>

  <div class="footer-actions">
    <button class="btn-borrar" onclick="borrarHistorial()">🗑 LIMPIAR VISTOS</button>
  </div>
</main>

<div id="player" class="video-overlay hidden">
  <div class="video-backdrop" onclick="cerrarPlayer()"></div>
  <div class="video-container">
    <button class="btn-close" onclick="cerrarPlayer()">✕</button>
    <iframe id="videoFrame" src="" allowfullscreen></iframe>
  </div>
</div>

<script>
function toggleMenu() {
  document.getElementById('mobile-menu').classList.toggle('hidden');
}

let peliculas = [];
let series = {};
let novelas = {};
let vistos = JSON.parse(localStorage.getItem('vistos_strange')) || [];
let seccionActual = 'peliculas';

function ocultarLoader() {
  document.getElementById('loader').style.display = 'none';
}

function normalizarTexto(t) {
  return t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
}

function eliminarDuplicados(lista) {
  const set = new Set();
  return lista.filter(p => {
    const norm = normalizarTexto(p.titulo);
    if (set.has(norm)) return false;
    set.add(norm);
    return true;
  });
}

async function cargarCatalogo() {
  try {
    const res = await fetch(`catalogo.json?v=${Date.now()}`);
    const data = await res.json();
    peliculas = eliminarDuplicados(data.peliculas || []);
    series = data.series || {};
    novelas = data.novelas || {};
    console.log(`Cargadas ${peliculas.length} películas`);
  } catch(e) {
    console.error('Error:', e);
  } finally {
    ocultarLoader();
  }
}

function marcarVisto(id) {
  if (!id || vistos.includes(id)) return;
  vistos.push(id);
  localStorage.setItem('vistos_strange', JSON.stringify(vistos));
  document.querySelectorAll(`.card[data-id="${id}"]`).forEach(c => c.classList.add('visto'));
}

function borrarHistorial() {
  if(confirm("¿Borrar historial?")) {
    vistos = [];
    localStorage.removeItem('vistos_strange');
    document.querySelectorAll('.card').forEach(c => c.classList.remove('visto'));
  }
}

function mostrarSeccion(seccion) {
  seccionActual = seccion;
  document.querySelectorAll('.content-section').forEach(s => s.classList.add('hidden'));
  document.getElementById(`sec-${seccion}`).classList.remove('hidden');
  document.getElementById('header-slider').style.display = seccion === 'peliculas' ? 'block' : 'none';
  document.getElementById('buscador').value = "";
  const genBar = document.getElementById('generos-container');
  if(genBar) genBar.style.display = seccion === 'peliculas' ? 'flex' : 'none';
  document.querySelectorAll('.card').forEach(c => c.style.display = 'block');
}

function volver() {
  mostrarSeccion('peliculas');
}

function asignarGenero(p) {
  const t = normalizarTexto(p.titulo);
  if(t.includes('telefono') || t.includes('abismo') || t.includes('conjuro') || t.includes('chucky') || t.includes('terrifier') || t.includes('scream') || t.includes('silent hill') || t.includes('the room') || t.includes('five nights')) return 'Terror';
  if(t.includes('yo antes') || t.includes('sonido de libertad') || t.includes('dejar el mundo') || t.includes('babel')) return 'Drama';
  if(t.includes('tron') || t.includes('apocalypto') || t.includes('pantera') || t.includes('estado electrico')) return 'Acción';
  if(t.includes('bambi') || t.includes('como entrenar') || t.includes('harry potter') || t.includes('mufasa')) return 'Animación';
  return 'Otros';
}

function obtenerGeneros() {
  const gen = {};
  peliculas.forEach(p => {
    const g = asignarGenero(p);
    if(!gen[g]) gen[g] = [];
    gen[g].push(p);
  });
  return gen;
}

function renderizarGeneros() {
  const mapa = obtenerGeneros();
  const lista = Object.keys(mapa).sort();
  let cont = document.getElementById('generos-container');
  if(!cont) {
    cont = document.createElement('div');
    cont.id = 'generos-container';
    cont.className = 'generos-bar';
    document.querySelector('.navbar').after(cont);
  }
  cont.innerHTML = '<button class="genero-btn active" data-genero="todos">🎬 TODOS</button>';
  lista.forEach(g => {
    const btn = document.createElement('button');
    btn.className = 'genero-btn';
    btn.textContent = g;
    btn.dataset.genero = g;
    cont.appendChild(btn);
  });
  document.querySelectorAll('.genero-btn').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.genero-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filtrarPorGenero(btn.dataset.genero);
    };
  });
  window.generosMap = mapa;
}

function filtrarPorGenero(genero) {
  const grid = document.getElementById('grid-peliculas');
  grid.innerHTML = '';
  let pelis = genero === 'todos' ? [...peliculas] : (window.generosMap[genero] || []);
  pelis.sort((a,b) => a.titulo.localeCompare(b.titulo));
  pelis.forEach(p => {
    grid.appendChild(crearCard(p.titulo, p.portada, () => mostrarDetallePelicula(p), p.id));
  });
}

function abrirReproductor(id) {
  document.getElementById('videoFrame').src = `https://drive.google.com/file/d/${id}/preview`;
  document.getElementById('player').classList.remove('hidden');
}

function cerrarPlayer() {
  document.getElementById('player').classList.add('hidden');
  document.getElementById('videoFrame').src = "";
}

function mostrarDetallePelicula(peli) {
  document.querySelectorAll('.content-section').forEach(s => s.classList.add('hidden'));
  document.getElementById('sec-movie-detail').classList.remove('hidden');
  document.getElementById('header-slider').style.display = 'none';
  const genBar = document.getElementById('generos-container');
  if(genBar) genBar.style.display = 'none';

  let defaultId = peli.id;
  if(peli.idiomas && peli.idiomas.length) defaultId = peli.idiomas[0].id;

  const generoActual = asignarGenero(peli);
  const similares = peliculas.filter(p => asignarGenero(p) === generoActual && p.titulo !== peli.titulo).slice(0, 6);

  let similaresHtml = '';
  if(similares.length) {
    similaresHtml = `
      <div class="similares-section">
        <h4 class="similares-title">🎬 PELÍCULAS SIMILARES</h4>
        <div class="similares-grid" id="similaresGrid"></div>
      </div>
    `;
  }

  const container = document.getElementById('movie-detail-container');
  container.innerHTML = `
    <div class="video-wrapper">
      <iframe src="https://drive.google.com/file/d/${defaultId}/preview" allow="autoplay; fullscreen" allowfullscreen></iframe>
    </div>
    <div class="info-row">
      <div class="poster-col">
        <img src="${peli.portada}" alt="${peli.titulo}">
      </div>
      <div class="info-col">
        <h3 class="movie-title">${peli.titulo}</h3>
        <p class="sinopsis">${peli.sinopsis || '🎬 Disfruta de esta película en Cinema STRANGER'}</p>
        ${peli.director ? `<div class="director">🎬 DIRECTOR: ${peli.director}</div>` : ''}
        ${peli.actores ? `<div class="actores">⭐ REPARTO: ${peli.actores}</div>` : ''}
      </div>
    </div>
    ${similaresHtml}
  `;

  marcarVisto(defaultId);

  const similaresGrid = document.getElementById('similaresGrid');
  if(similaresGrid) {
    similares.forEach(sim => {
      const card = document.createElement('div');
      card.className = 'similares-card';
      card.innerHTML = `<img src="${sim.portada}"><p>${sim.titulo}</p>`;
      card.onclick = () => mostrarDetallePelicula(sim);
      similaresGrid.appendChild(card);
    });
  }
  window.scrollTo(0, 0);
}

function verDetalle(titulo, lista) {
  document.querySelectorAll('.content-section').forEach(s => s.classList.add('hidden'));
  document.getElementById('vista-detalles').classList.remove('hidden');
  document.getElementById('detalle-titulo').innerText = titulo;
  document.getElementById('header-slider').style.display = 'none';
  const genBar = document.getElementById('generos-container');
  if(genBar) genBar.style.display = 'none';
  
  const grid = document.getElementById('grid-detalles');
  grid.innerHTML = "";
  lista.forEach(item => {
    grid.appendChild(crearCard(item.titulo, item.portada, () => abrirReproductor(item.id), item.id));
  });
  window.scrollTo(0, 0);
}

function crearCard(titulo, portada, accion, id) {
  const div = document.createElement('div');
  div.className = 'card';
  if(id && vistos.includes(id)) div.classList.add('visto');
  if(id) div.dataset.id = id;
  div.innerHTML = `
    <div class="badge-visto">✓</div>
    <img src="${portada}" onerror="this.src='https://placehold.co/150x225?text=No+Image'">
    <p>${titulo}</p>
  `;
  div.onclick = (e) => { e.stopPropagation(); accion(); };
  return div;
}

function cargarTodo() {
  renderizarGeneros();
  filtrarPorGenero('todos');
  
  const gridSeries = document.getElementById('grid-series');
  if(gridSeries) {
    gridSeries.innerHTML = '';
    Object.keys(series).forEach(s => {
      gridSeries.appendChild(crearCard(s, series[s][0]?.portada || '', () => verDetalle(s, series[s])));
    });
  }
  
  const gridNovelas = document.getElementById('grid-novelas');
  if(gridNovelas) {
    gridNovelas.innerHTML = '';
    Object.keys(novelas).forEach(n => {
      gridNovelas.appendChild(crearCard(n, novelas[n][0]?.portada || '', () => verDetalle(n, novelas[n])));
    });
  }
}

function filtrarContenido() {
  const q = document.getElementById('buscador').value.toLowerCase();
  const activa = document.querySelector('.content-section:not(.hidden)');
  if(!activa) return;
  activa.querySelectorAll('.card').forEach(c => {
    const titulo = c.querySelector('p')?.innerText?.toLowerCase() || '';
    c.style.display = titulo.includes(q) ? 'block' : 'none';
  });
}

function initSlider() {
  const wrapper = document.getElementById('slider');
  if(!wrapper) return;
  wrapper.innerHTML = '';
  const portadas = [...new Set(peliculas.map(p => p.portada))].slice(0, 15);
  portadas.forEach(ruta => {
    const img = document.createElement('img');
    img.src = ruta;
    img.onerror = () => img.style.display = 'none';
    img.onclick = () => {
      const p = peliculas.find(peli => peli.portada === ruta);
      if(p) mostrarDetallePelicula(p);
    };
    wrapper.appendChild(img);
  });
}

document.addEventListener("DOMContentLoaded", async () => {
  await cargarCatalogo();
  initSlider();
  cargarTodo();
});
</script>
</body>
</html>
